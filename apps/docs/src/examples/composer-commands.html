<div id="composer-commands" class="flex w-full max-w-md flex-col gap-3 pt-40">
  <tec-composer>
    <tec-composer-field>
      <tec-composer-commands>
        <tec-composer-command command="new" group="Chat">
          <svg slot="start" xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 3H5a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2v-7" /><path d="M18.375 2.625a1 1 0 0 1 3 3l-9.013 9.014a2 2 0 0 1-.853.505l-2.873.84a.5.5 0 0 1-.62-.62l.84-2.873a2 2 0 0 1 .506-.852z" /></svg>
          Start a new conversation
        </tec-composer-command>
        <tec-composer-command command="acknowledge" group="On this page">
          <svg slot="start" xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M18 6 7 17l-5-5" /><path d="m22 10-7.5 7.5L13 16" /></svg>
          Acknowledge alert A-7
        </tec-composer-command>
        <tec-composer-command command="note" group="On this page">
          <svg slot="start" xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M13.4 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2v-7.4" /><path d="M2 6h4" /><path d="M2 10h4" /><path d="M2 14h4" /><path d="M2 18h4" /><path d="M21.378 5.626a1 1 0 1 0-3.004-3.004l-5.01 5.012a2 2 0 0 0-.506.854l-.837 2.87a.5.5 0 0 0 .62.62l2.87-.837a2 2 0 0 0 .854-.506z" /></svg>
          Add a note to well 34/10-A-12
        </tec-composer-command>
      </tec-composer-commands>
      <tec-composer-input placeholder="Type / for commands…"></tec-composer-input>
      <tec-composer-toolbar>
        <tec-composer-submit></tec-composer-submit>
      </tec-composer-toolbar>
    </tec-composer-field>
    <tec-composer-hint></tec-composer-hint>
    <tec-composer-status-message></tec-composer-status-message>
  </tec-composer>
  <div class="flex flex-col gap-1 text-sm text-muted-foreground empty:hidden" aria-live="polite"></div>
</div>

<script type="module">
  const root = document.getElementById("composer-commands")
  const composer = root.querySelector("tec-composer")
  const log = root.querySelector("[aria-live]")
  const line = (text) => log.append(Object.assign(document.createElement("p"), { textContent: text }))

  composer.addEventListener("tec-submit", (event) => line(`Sent: ${event.detail.text}`))
  composer.addEventListener("tec-select", (event) => {
    const command = event.target.closest("tec-composer-command")
    if (!command) return
    if (event.detail.value === "new") {
      log.replaceChildren()
      return
    }
    // Leave the rest for the user to finish, as a prompt.
    composer.setValue(`${command.labelText}: `)
  })
</script>
