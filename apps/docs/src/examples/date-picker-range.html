<tec-field class="mx-auto w-60">
  <tec-field-label for="date-picker-range">Date Picker Range</tec-field-label>
  <tec-date-range-picker id="date-picker-range" appearance="button" visible-months="2">
    <tec-icon name="calendar" slot="start" aria-hidden="true" style="width:16px;height:16px"></tec-icon>
  </tec-date-range-picker>
</tec-field>
<script type="module">
  import { Calendar } from "lucide"
  import { registerIcons } from "@tecton/wc/icon/registry.js"

  registerIcons({ Calendar })

  const year = new Date().getFullYear()
  // January 20 + 20 days.
  document.getElementById("date-picker-range").value = `${year}-01-20/${year}-02-09`
</script>
