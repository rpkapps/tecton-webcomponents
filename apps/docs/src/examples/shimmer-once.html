<div id="shimmer-once" class="flex flex-col items-center gap-4">
  <p class="shimmer text-sm text-muted-foreground shimmer-duration-1100 shimmer-once">Generating response&hellip;</p>
  <tec-button variant="outline" size="sm">Replay</tec-button>
</div>
<script type="module">
  const root = document.getElementById("shimmer-once")
  root.querySelector("tec-button").addEventListener("click", () => {
    // A fresh copy of the text restarts its single sweep.
    const text = root.querySelector("p")
    text.replaceWith(text.cloneNode(true))
  })
</script>
