<div id="button-events" class="flex flex-col items-center gap-3">
  <div class="flex gap-2">
    <tec-button variant="outline" data-action="refresh">
      <svg slot="start" xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 12a9 9 0 0 1 9-9 9.75 9.75 0 0 1 6.74 2.74L21 8"/><path d="M21 3v5h-5"/><path d="M21 12a9 9 0 0 1-9 9 9.75 9.75 0 0 1-6.74-2.74L3 16"/><path d="M8 16H3v5"/></svg>
      Refresh
    </tec-button>
    <tec-button variant="outline" data-action="export">
      <svg slot="start" xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 15V3"/><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><path d="m7 10 5 5 5-5"/></svg>
      Export LAS
    </tec-button>
  </div>
  <p class="text-sm text-muted-foreground" aria-live="polite">Press a button (mouse, Enter or Space).</p>
</div>
<script type="module">
  const root = document.getElementById("button-events")
  const status = root.querySelector("p")
  let count = 0

  // `click` fires for pointer and keyboard activation, never while disabled.
  root.addEventListener("click", (event) => {
    const button = event.target.closest("tec-button")
    if (!button) return
    count += 1
    status.textContent = `${button.dataset.action} (${count})`
  })
</script>
