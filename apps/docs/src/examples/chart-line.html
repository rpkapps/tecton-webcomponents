<tec-chart id="chart-line" class="min-h-[200px] w-full" label="Visitors by month, line chart">
  <tec-chart-grid></tec-chart-grid>
  <tec-chart-x-axis key="month" tick-margin="8"></tec-chart-x-axis>
  <tec-chart-tooltip></tec-chart-tooltip>
  <tec-chart-line key="desktop" curve="natural"></tec-chart-line>
  <tec-chart-line key="mobile" curve="natural"></tec-chart-line>
</tec-chart>
<script type="module">
  const chart = document.getElementById("chart-line")
  chart.querySelector("tec-chart-x-axis").tickFormatter = (value) => value.slice(0, 3)
  chart.margin = { start: 12, end: 12 }
  chart.config = {
    desktop: { label: "Desktop", color: "var(--tec-chart-1)" },
    mobile: { label: "Mobile", color: "var(--tec-chart-2)" },
  }
  chart.data = [
    { month: "January", desktop: 186, mobile: 80 },
    { month: "February", desktop: 305, mobile: 200 },
    { month: "March", desktop: 237, mobile: 120 },
    { month: "April", desktop: 73, mobile: 190 },
    { month: "May", desktop: 209, mobile: 130 },
    { month: "June", desktop: 214, mobile: 140 },
  ]
</script>
