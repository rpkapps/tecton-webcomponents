<div id="background-tones" class="grid w-full max-w-3xl grid-cols-2 gap-3 sm:grid-cols-3">
  <div data-tile class="relative isolate flex h-32 flex-col justify-end overflow-hidden rounded-lg border border-border bg-background p-3 [&:fullscreen]:rounded-none [&:fullscreen]:border-0 [&:fullscreen]:p-10">
    <tec-background effect="seismic" tone="neutral" intensity="high"></tec-background>
    <tec-button variant="ghost" size="icon-sm" aria-label="View fullscreen" data-fullscreen class="absolute end-2 top-2">
      <tec-icon name="maximize2" aria-hidden="true"></tec-icon>
    </tec-button>
    <span class="text-sm font-medium">neutral</span>
  </div>
  <div data-tile class="relative isolate flex h-32 flex-col justify-end overflow-hidden rounded-lg border border-border bg-background p-3 [&:fullscreen]:rounded-none [&:fullscreen]:border-0 [&:fullscreen]:p-10">
    <tec-background effect="seismic" tone="primary" intensity="high"></tec-background>
    <tec-button variant="ghost" size="icon-sm" aria-label="View fullscreen" data-fullscreen class="absolute end-2 top-2">
      <tec-icon name="maximize2" aria-hidden="true"></tec-icon>
    </tec-button>
    <span class="text-sm font-medium">primary</span>
  </div>
  <div data-tile class="relative isolate flex h-32 flex-col justify-end overflow-hidden rounded-lg border border-border bg-background p-3 [&:fullscreen]:rounded-none [&:fullscreen]:border-0 [&:fullscreen]:p-10">
    <tec-background effect="seismic" tone="azure" intensity="high"></tec-background>
    <tec-button variant="ghost" size="icon-sm" aria-label="View fullscreen" data-fullscreen class="absolute end-2 top-2">
      <tec-icon name="maximize2" aria-hidden="true"></tec-icon>
    </tec-button>
    <span class="text-sm font-medium">azure</span>
  </div>
  <div data-tile class="relative isolate flex h-32 flex-col justify-end overflow-hidden rounded-lg border border-border bg-background p-3 [&:fullscreen]:rounded-none [&:fullscreen]:border-0 [&:fullscreen]:p-10">
    <tec-background effect="seismic" tone="saffron" intensity="high"></tec-background>
    <tec-button variant="ghost" size="icon-sm" aria-label="View fullscreen" data-fullscreen class="absolute end-2 top-2">
      <tec-icon name="maximize2" aria-hidden="true"></tec-icon>
    </tec-button>
    <span class="text-sm font-medium">saffron</span>
  </div>
  <div data-tile class="relative isolate flex h-32 flex-col justify-end overflow-hidden rounded-lg border border-border bg-background p-3 [&:fullscreen]:rounded-none [&:fullscreen]:border-0 [&:fullscreen]:p-10">
    <tec-background effect="seismic" tone="lime" intensity="high"></tec-background>
    <tec-button variant="ghost" size="icon-sm" aria-label="View fullscreen" data-fullscreen class="absolute end-2 top-2">
      <tec-icon name="maximize2" aria-hidden="true"></tec-icon>
    </tec-button>
    <span class="text-sm font-medium">lime</span>
  </div>
  <div data-tile class="relative isolate flex h-32 flex-col justify-end overflow-hidden rounded-lg border border-border bg-background p-3 [&:fullscreen]:rounded-none [&:fullscreen]:border-0 [&:fullscreen]:p-10">
    <tec-background effect="seismic" tone="blue" intensity="high"></tec-background>
    <tec-button variant="ghost" size="icon-sm" aria-label="View fullscreen" data-fullscreen class="absolute end-2 top-2">
      <tec-icon name="maximize2" aria-hidden="true"></tec-icon>
    </tec-button>
    <span class="text-sm font-medium">blue</span>
  </div>
</div>
<script type="module">
  import { Maximize2 } from "lucide"
  import { registerIcons } from "@tecton/wc/icon/registry.js"

  registerIcons({ Maximize2 })

  // "View fullscreen" shows a tile's effect and content full screen; the same button (or Escape) leaves.
  const root = document.getElementById("background-tones")
  root.addEventListener("click", (event) => {
    const tile = event.target.closest("[data-fullscreen]")?.closest("[data-tile]")
    if (!tile) return
    if (document.fullscreenElement === tile) document.exitFullscreen()
    else tile.requestFullscreen?.()
  })
  document.addEventListener("fullscreenchange", () => {
    for (const button of root.querySelectorAll("[data-fullscreen]")) {
      const open = document.fullscreenElement === button.closest("[data-tile]")
      button.setAttribute("aria-label", open ? "Exit fullscreen" : "View fullscreen")
    }
  })
</script>
