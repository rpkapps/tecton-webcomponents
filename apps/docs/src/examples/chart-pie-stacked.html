<tec-chart id="chart-pie-stacked" class="mx-auto aspect-square w-full max-w-[250px]" label="Desktop (inner pie) and mobile (outer ring) visitors by month">
  <tec-chart-tooltip></tec-chart-tooltip>
  <tec-chart-pie key="desktop" name-key="month" outer-radius="60"></tec-chart-pie>
  <tec-chart-pie key="mobile" name-key="month" inner-radius="70" outer-radius="90"></tec-chart-pie>
</tec-chart>
<script type="module">
  const chart = document.getElementById("chart-pie-stacked")
  chart.config = {
    desktop: { label: "Desktop" },
    mobile: { label: "Mobile" },
    january: { label: "January", color: "var(--tec-chart-1)" },
    february: { label: "February", color: "var(--tec-chart-2)" },
    march: { label: "March", color: "var(--tec-chart-3)" },
    april: { label: "April", color: "var(--tec-chart-4)" },
    may: { label: "May", color: "var(--tec-chart-5)" },
  }
  chart.data = [
    { month: "january", desktop: 186, mobile: 80 },
    { month: "february", desktop: 305, mobile: 200 },
    { month: "march", desktop: 237, mobile: 120 },
    { month: "april", desktop: 173, mobile: 190 },
    { month: "may", desktop: 209, mobile: 130 },
  ]
</script>
