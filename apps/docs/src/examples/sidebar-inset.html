<div class="h-[28rem] w-full overflow-hidden rounded-lg border border-border [contain:layout]">
  <tec-sidebar-provider class="h-full min-h-0" persist="none" shortcut="">
    <tec-sidebar variant="inset" collapsible="icon">
      <tec-sidebar-header>
        <div class="flex h-8 items-center gap-2 px-2 text-sm font-medium"><tec-icon name="hexagon" class="size-4 shrink-0" aria-hidden="true"></tec-icon><span class="truncate">Gullfaks</span></div>
      </tec-sidebar-header>
      <tec-sidebar-content>
        <tec-sidebar-group>
          <tec-sidebar-group-label>Field</tec-sidebar-group-label>
          <tec-sidebar-menu>
            <tec-sidebar-menu-item>
              <tec-sidebar-menu-button href="#" active tooltip="Overview"><tec-icon name="layout-dashboard" aria-hidden="true" style="width:16px;height:16px"></tec-icon><span>Overview</span></tec-sidebar-menu-button>
            </tec-sidebar-menu-item>
            <tec-sidebar-menu-item>
              <tec-sidebar-menu-button href="#" tooltip="Wells"><tec-icon name="drill" aria-hidden="true" style="width:16px;height:16px"></tec-icon><span>Wells</span></tec-sidebar-menu-button>
              <tec-sidebar-menu-badge>12</tec-sidebar-menu-badge>
            </tec-sidebar-menu-item>
            <tec-sidebar-menu-item>
              <tec-sidebar-menu-button href="#" tooltip="Horizons"><tec-icon name="mountain" aria-hidden="true" style="width:16px;height:16px"></tec-icon><span>Horizons</span></tec-sidebar-menu-button>
            </tec-sidebar-menu-item>
            <tec-sidebar-menu-item>
              <tec-sidebar-menu-button href="#" tooltip="Reports"><tec-icon name="file-text" aria-hidden="true" style="width:16px;height:16px"></tec-icon><span>Reports</span></tec-sidebar-menu-button>
            </tec-sidebar-menu-item>
          </tec-sidebar-menu>
        </tec-sidebar-group>
      </tec-sidebar-content>
      <tec-sidebar-footer>
        <tec-sidebar-menu>
          <tec-sidebar-menu-item>
            <tec-sidebar-menu-button href="#" tooltip="Settings"><tec-icon name="settings" aria-hidden="true" style="width:16px;height:16px"></tec-icon><span>Settings</span></tec-sidebar-menu-button>
          </tec-sidebar-menu-item>
        </tec-sidebar-menu>
      </tec-sidebar-footer>
      <tec-sidebar-rail></tec-sidebar-rail>
    </tec-sidebar>
    <tec-sidebar-inset embedded>
      <header class="flex h-12 shrink-0 items-center gap-2 border-b border-border-subtle px-3">
        <tec-sidebar-trigger class="-ms-1"></tec-sidebar-trigger>
        <span class="text-sm font-medium">Inset</span>
      </header>
      <div class="flex flex-1 flex-col gap-4 p-4">
        <div class="aspect-video rounded-lg bg-muted/50"></div>
        <div class="min-h-24 flex-1 rounded-lg bg-muted/50"></div>
      </div>
    </tec-sidebar-inset>
  </tec-sidebar-provider>
</div>
<script type="module">
  import { Drill, FileText, Hexagon, LayoutDashboard, Mountain, Settings } from "lucide"
  import { registerIcons } from "@tecton/wc/icon/registry.js"

  registerIcons({ Drill, FileText, Hexagon, LayoutDashboard, Mountain, Settings })
</script>
