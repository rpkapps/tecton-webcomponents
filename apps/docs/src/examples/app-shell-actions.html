<tec-app-shell class="h-auto w-full max-w-3xl overflow-hidden rounded-lg border border-border">
  <tec-app-shell-header>
    <tec-app-shell-brand>Tecton</tec-app-shell-brand>
    <tec-app-shell-actions>
      <tec-app-shell-command-trigger>Search or jump to…</tec-app-shell-command-trigger>
      <tec-app-shell-action label="Help" shortcut="?">
        {CircleHelp}
      </tec-app-shell-action>
      <tec-app-shell-action label="What's new">
        {Sparkles}
      </tec-app-shell-action>
      <tec-app-shell-action label="Report a bug">
        {Bug}
      </tec-app-shell-action>
      <tec-app-shell-action label="Settings">
        {Settings}
      </tec-app-shell-action>
      <tec-dropdown-menu side="bottom" align="end">
        <tec-app-shell-user-menu-trigger slot="trigger" name="Sarah Elliott"></tec-app-shell-user-menu-trigger>
        <tec-dropdown-menu-group>
          <tec-dropdown-menu-label>Sarah Elliott</tec-dropdown-menu-label>
        </tec-dropdown-menu-group>
        <tec-dropdown-menu-separator></tec-dropdown-menu-separator>
        <tec-dropdown-menu-group>
          <tec-dropdown-menu-item>
            {User}
            Profile
          </tec-dropdown-menu-item>
          <tec-dropdown-menu-item>
            {LogOut}
            Sign out
          </tec-dropdown-menu-item>
        </tec-dropdown-menu-group>
      </tec-dropdown-menu>
    </tec-app-shell-actions>
  </tec-app-shell-header>
</tec-app-shell>
