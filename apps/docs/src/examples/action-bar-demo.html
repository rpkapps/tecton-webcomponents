<div id="action-bar-demo" class="flex w-full max-w-3xl flex-col gap-3">
  <!-- The table toolbar; the action bar replaces it while rows are selected. -->
  <div class="grid min-h-11 items-center">
    <tec-action-bar aria-label="Selected wells">
      <tec-action-bar-selection count="2" total="5" clearable></tec-action-bar-selection>
      <tec-action-bar-actions aria-label="Selection actions">
        <tec-overflow-item value="assign" priority="2">
          <tec-button variant="outline" size="sm"><svg slot="start" xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M16 21v-2a4 4 0 0 0-4-4H6a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/><line x1="19" x2="19" y1="8" y2="14"/><line x1="22" x2="16" y1="11" y2="11"/></svg><tec-overflow-label>Assign</tec-overflow-label></tec-button>
        </tec-overflow-item>
        <tec-overflow-item value="tag" priority="1">
          <tec-button variant="outline" size="sm"><svg slot="start" xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12.586 2.586A2 2 0 0 0 11.172 2H4a2 2 0 0 0-2 2v7.172a2 2 0 0 0 .586 1.414l8.704 8.704a2.426 2.426 0 0 0 3.42 0l6.58-6.58a2.426 2.426 0 0 0 0-3.42z"/><circle cx="7.5" cy="7.5" r=".5" fill="currentColor"/></svg><tec-overflow-label>Add tag</tec-overflow-label></tec-button>
        </tec-overflow-item>
        <tec-overflow-item value="export">
          <tec-button variant="outline" size="sm"><svg slot="start" xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 15V3"/><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><path d="m7 10 5 5 5-5"/></svg><tec-overflow-label>Export</tec-overflow-label></tec-button>
        </tec-overflow-item>
        <tec-overflow-item value="archive">
          <tec-button variant="outline" size="sm"><svg slot="start" xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect width="20" height="5" x="2" y="3" rx="1"/><path d="M4 8v11a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8"/><path d="M10 12h4"/></svg><tec-overflow-label>Archive</tec-overflow-label></tec-button>
        </tec-overflow-item>
        <tec-overflow-divider></tec-overflow-divider>
        <tec-overflow-item value="delete" label-behavior="keep">
          <tec-button variant="destructive" size="sm"><svg slot="start" xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M10 11v6"/><path d="M14 11v6"/><path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6"/><path d="M3 6h18"/><path d="M8 6V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"/></svg>Delete</tec-button>
        </tec-overflow-item>
      </tec-action-bar-actions>
    </tec-action-bar>
    <div class="flex items-center gap-2" data-toolbar hidden>
      <tec-input aria-label="Filter wells" placeholder="Filter wells" class="max-w-56"></tec-input>
      <tec-button variant="outline" size="sm" class="ms-auto">New well</tec-button>
    </div>
  </div>
  <div class="overflow-hidden rounded-md border border-border">
    <tec-table class="w-full">
      <table aria-label="Wells">
        <thead>
          <tr>
            <th scope="col" class="w-10"><tec-checkbox aria-label="Select all wells" data-all></tec-checkbox></th>
            <th scope="col">Well</th>
            <th scope="col">Field</th>
            <th scope="col">Status</th>
          </tr>
        </thead>
        <tbody>
        <tr>
          <td class="w-10"><tec-checkbox aria-label="Select 34/10-A-12" value="a12" checked></tec-checkbox></td>
          <th scope="row">34/10-A-12</th>
          <td>Gullfaks</td>
          <td><tec-badge variant="success" appearance="outline">Producing</tec-badge></td>
        </tr>
        <tr>
          <td class="w-10"><tec-checkbox aria-label="Select 34/10-B-3" value="b3"></tec-checkbox></td>
          <th scope="row">34/10-B-3</th>
          <td>Gullfaks</td>
          <td><tec-badge variant="warning" appearance="outline">Shut in</tec-badge></td>
        </tr>
        <tr>
          <td class="w-10"><tec-checkbox aria-label="Select 33/9-C-7" value="c7" checked></tec-checkbox></td>
          <th scope="row">33/9-C-7</th>
          <td>Statfjord</td>
          <td><tec-badge variant="info" appearance="outline">Drilling</tec-badge></td>
        </tr>
        <tr>
          <td class="w-10"><tec-checkbox aria-label="Select 34/7-D-2" value="d2"></tec-checkbox></td>
          <th scope="row">34/7-D-2</th>
          <td>Snorre</td>
          <td><tec-badge variant="success" appearance="outline">Producing</tec-badge></td>
        </tr>
        <tr>
          <td class="w-10"><tec-checkbox aria-label="Select 34/7-E-9" value="e9"></tec-checkbox></td>
          <th scope="row">34/7-E-9</th>
          <td>Snorre</td>
          <td><tec-badge variant="warning" appearance="outline">Shut in</tec-badge></td>
        </tr>
        </tbody>
      </table>
    </tec-table>
  </div>
</div>
<script type="module">
  const root = document.getElementById("action-bar-demo")
  const bar = root.querySelector("tec-action-bar")
  const summary = root.querySelector("tec-action-bar-selection")
  const toolbar = root.querySelector("[data-toolbar]")
  const all = root.querySelector("[data-all]")
  const rows = [...root.querySelectorAll("tbody tec-checkbox")]

  const render = () => {
    const count = rows.filter((row) => row.checked).length
    summary.count = count
    bar.hidden = count === 0
    toolbar.hidden = count > 0
    all.checked = count === rows.length
    all.indeterminate = count > 0 && count < rows.length
    for (const row of rows) {
      if (row.checked) row.closest("tr").dataset.state = "selected"
      else delete row.closest("tr").dataset.state
    }
  }
  const clear = () => {
    for (const row of rows) row.checked = false
    render()
  }

  all.addEventListener("change", () => {
    for (const row of rows) row.checked = all.checked
    render()
  })
  for (const row of rows) row.addEventListener("change", render)
  bar.addEventListener("tec-clear", clear)
  // Escape while focus is in the bar clears the selection.
  bar.addEventListener("tec-dismiss", clear)
  customElements.whenDefined("tec-checkbox").then(render)
</script>
