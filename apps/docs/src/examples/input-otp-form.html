<form id="input-otp-form" class="mx-auto w-full max-w-md" novalidate>
  <tec-card>
    <tec-card-header>
      <tec-card-title>Verify your login</tec-card-title>
      <tec-card-description>
        Enter the verification code we sent to your email address: <span class="font-medium">m@example.com</span>.
      </tec-card-description>
    </tec-card-header>
    <tec-card-content>
      <tec-field>
        <div class="flex items-center justify-between">
          <tec-field-label>Verification code</tec-field-label>
          <tec-button variant="outline" size="xs"><svg slot="start" xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 12a9 9 0 0 1 9-9 9.75 9.75 0 0 1 6.74 2.74L21 8" /><path d="M21 3v5h-5" /><path d="M21 12a9 9 0 0 1-9 9 9.75 9.75 0 0 1-6.74-2.74L3 16" /><path d="M8 16H3v5" /></svg> Resend Code</tec-button>
        </div>
        <tec-input-otp name="code" maxlength="6" pattern="digits" required>
          <tec-input-otp-group class="[--tec-input-otp-slot-height:3rem] [--tec-input-otp-slot-width:2.75rem] [--tec-input-otp-slot-font-size:var(--tec-text-xl)]">
            <tec-input-otp-slot></tec-input-otp-slot>
            <tec-input-otp-slot></tec-input-otp-slot>
            <tec-input-otp-slot></tec-input-otp-slot>
          </tec-input-otp-group>
          <tec-input-otp-separator class="mx-2"></tec-input-otp-separator>
          <tec-input-otp-group class="[--tec-input-otp-slot-height:3rem] [--tec-input-otp-slot-width:2.75rem] [--tec-input-otp-slot-font-size:var(--tec-text-xl)]">
            <tec-input-otp-slot></tec-input-otp-slot>
            <tec-input-otp-slot></tec-input-otp-slot>
            <tec-input-otp-slot></tec-input-otp-slot>
          </tec-input-otp-group>
        </tec-input-otp>
        <tec-field-description>
          <a href="#">I no longer have access to this email address.</a>
        </tec-field-description>
        <tec-field-error></tec-field-error>
      </tec-field>
    </tec-card-content>
    <tec-card-footer>
      <tec-field>
        <tec-button type="submit" class="w-full">Verify</tec-button>
        <div class="text-sm text-muted-foreground">
          Having trouble signing in?
          <a href="#" class="underline underline-offset-4 transition-colors hover:text-primary">Contact support</a>
        </div>
      </tec-field>
    </tec-card-footer>
  </tec-card>
</form>
<script type="module">
  const form = document.getElementById("input-otp-form")
  form.addEventListener("submit", (event) => {
    event.preventDefault()
    form.reportValidity()
  })
</script>
