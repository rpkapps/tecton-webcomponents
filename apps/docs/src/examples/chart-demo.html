<div id="chart-demo" class="flex w-full flex-col gap-6 overflow-hidden rounded-xl bg-card pb-4 text-sm text-card-foreground ring-1 ring-foreground/10">
  <div class="flex flex-col items-stretch border-b border-border sm:flex-row">
    <div class="flex flex-1 flex-col justify-center gap-1 px-6 pt-4 pb-3 sm:py-0">
      <div class="text-base leading-normal font-medium">Bar Chart - Interactive</div>
      <div class="text-sm text-muted-foreground">Showing total visitors for the last 3 months</div>
    </div>
    <div class="flex">
      <button type="button" data-series="desktop" aria-pressed="true" class="relative z-30 flex flex-1 flex-col justify-center gap-1 border-t border-border px-6 py-4 text-start outline-none even:border-s focus-visible:ring-2 focus-visible:ring-ring aria-pressed:bg-muted/50 sm:border-t-0 sm:border-s sm:px-8 sm:py-6">
        <span class="text-xs text-muted-foreground">Desktop</span>
        <span class="text-lg leading-none font-bold sm:text-3xl" data-total="desktop"></span>
      </button>
      <button type="button" data-series="mobile" aria-pressed="false" class="relative z-30 flex flex-1 flex-col justify-center gap-1 border-t border-border px-6 py-4 text-start outline-none even:border-s focus-visible:ring-2 focus-visible:ring-ring aria-pressed:bg-muted/50 sm:border-t-0 sm:border-s sm:px-8 sm:py-6">
        <span class="text-xs text-muted-foreground">Mobile</span>
        <span class="text-lg leading-none font-bold sm:text-3xl" data-total="mobile"></span>
      </button>
    </div>
  </div>
  <div class="px-2 sm:p-6">
    <tec-chart class="aspect-auto h-[250px] w-full" label="Visitors per day, April 2024">
      <tec-chart-grid></tec-chart-grid>
      <tec-chart-x-axis key="date" min-tick-gap="32"></tec-chart-x-axis>
      <tec-chart-tooltip class="w-[150px]" name-key="views"></tec-chart-tooltip>
      <tec-chart-bar key="desktop"></tec-chart-bar>
    </tec-chart>
  </div>
</div>
<script type="module">
  const root = document.getElementById("chart-demo")
  const chart = root.querySelector("tec-chart")
  const bar = chart.querySelector("tec-chart-bar")

  const data = [
    { date: "2024-04-01", desktop: 222, mobile: 150 },
    { date: "2024-04-02", desktop: 97, mobile: 180 },
    { date: "2024-04-03", desktop: 167, mobile: 120 },
    { date: "2024-04-04", desktop: 242, mobile: 260 },
    { date: "2024-04-05", desktop: 373, mobile: 290 },
    { date: "2024-04-06", desktop: 301, mobile: 340 },
    { date: "2024-04-07", desktop: 245, mobile: 180 },
    { date: "2024-04-08", desktop: 409, mobile: 320 },
    { date: "2024-04-09", desktop: 59, mobile: 110 },
    { date: "2024-04-10", desktop: 261, mobile: 190 },
    { date: "2024-04-11", desktop: 327, mobile: 350 },
    { date: "2024-04-12", desktop: 292, mobile: 210 },
    { date: "2024-04-13", desktop: 342, mobile: 380 },
    { date: "2024-04-14", desktop: 137, mobile: 220 },
    { date: "2024-04-15", desktop: 120, mobile: 170 },
    { date: "2024-04-16", desktop: 138, mobile: 190 },
    { date: "2024-04-17", desktop: 446, mobile: 360 },
    { date: "2024-04-18", desktop: 364, mobile: 410 },
    { date: "2024-04-19", desktop: 243, mobile: 180 },
    { date: "2024-04-20", desktop: 89, mobile: 150 },
    { date: "2024-04-21", desktop: 137, mobile: 200 },
    { date: "2024-04-22", desktop: 224, mobile: 170 },
    { date: "2024-04-23", desktop: 138, mobile: 230 },
    { date: "2024-04-24", desktop: 387, mobile: 290 },
    { date: "2024-04-25", desktop: 215, mobile: 250 },
    { date: "2024-04-26", desktop: 75, mobile: 130 },
    { date: "2024-04-27", desktop: 383, mobile: 420 },
    { date: "2024-04-28", desktop: 122, mobile: 180 },
    { date: "2024-04-29", desktop: 315, mobile: 240 },
    { date: "2024-04-30", desktop: 454, mobile: 380 },
  ]

  const toDate = (value) => new Date(`${value}T00:00:00`)
  chart.querySelector("tec-chart-x-axis").tickFormatter = (value) =>
    toDate(value).toLocaleDateString("en-US", { month: "short", day: "numeric" })
  chart.querySelector("tec-chart-tooltip").labelFormatter = (value) =>
    toDate(value).toLocaleDateString("en-US", { month: "short", day: "numeric", year: "numeric" })

  chart.config = {
    views: { label: "Page Views" },
    desktop: { label: "Desktop", color: "var(--tec-chart-2)" },
    mobile: { label: "Mobile", color: "var(--tec-chart-1)" },
  }
  chart.margin = { start: 12, end: 12 }
  chart.data = data

  for (const key of ["desktop", "mobile"]) {
    const total = data.reduce((sum, row) => sum + row[key], 0)
    root.querySelector(`[data-total="${key}"]`).textContent = total.toLocaleString()
  }

  root.addEventListener("click", (event) => {
    const button = event.target.closest("button[data-series]")
    if (!button) return
    for (const other of root.querySelectorAll("button[data-series]")) {
      other.setAttribute("aria-pressed", String(other === button))
    }
    bar.key = button.dataset.series
  })
</script>
