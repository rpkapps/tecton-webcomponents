<div class="flex w-full max-w-sm flex-col gap-8 py-12">
  <tec-bubble align="end"><tec-bubble-content>Hey there! what's up?</tec-bubble-content></tec-bubble>
  <tec-bubble-group>
    <tec-bubble variant="muted"><tec-bubble-content>Hey! Want to see chat bubbles?</tec-bubble-content></tec-bubble>
    <tec-bubble variant="muted">
      <tec-bubble-content>I can group messages, switch sides, and keep the whole thread easy to scan.</tec-bubble-content>
      <tec-bubble-reactions role="img" aria-label="Reaction: thumbs up"><span>👍</span></tec-bubble-reactions>
    </tec-bubble>
  </tec-bubble-group>
  <tec-bubble align="end"><tec-bubble-content>Sure. Hit me with your best demo.</tec-bubble-content></tec-bubble>
  <tec-bubble variant="muted">
    <tec-bubble-content>Yes. You are reading a demo that is demoing itself. Very meta. Very on-brand.</tec-bubble-content>
    <tec-bubble-reactions role="img" aria-label="Reactions: thumbs up, fire, eyes, and 2 more">
      <span>👍</span><span>🔥</span><span>👀</span><span>+2</span>
    </tec-bubble-reactions>
  </tec-bubble>
</div>
