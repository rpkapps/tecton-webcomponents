<tec-field-group class="mx-auto max-w-xs flex-row">
  <tec-field>
    <tec-field-label for="date-picker-time-date">Date</tec-field-label>
    <tec-date-picker id="date-picker-time-date" appearance="button" date-style="short" placeholder="Select date" caption-layout="dropdown" class="w-32">
      <svg slot="end" xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m6 9 6 6 6-6" /></svg>
    </tec-date-picker>
  </tec-field>
  <tec-field class="w-32">
    <tec-field-label for="date-picker-time-time">Time</tec-field-label>
    <tec-time-field id="date-picker-time-time" granularity="second" value="10:30:00"></tec-time-field>
  </tec-field>
</tec-field-group>
