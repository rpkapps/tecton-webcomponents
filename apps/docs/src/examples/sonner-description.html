<div id="sonner-description">
  <tec-button variant="outline" class="w-fit">Show Toast</tec-button>
</div>
<script type="module">
  import { toast } from "@tecton/wc/sonner"

  document
    .getElementById("sonner-description")
    .querySelector("tec-button")
    .addEventListener("click", () => toast("Event has been created", { description: "Monday, January 3rd at 6:00pm" }))
</script>
