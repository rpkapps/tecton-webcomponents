<div id="alert-dismissible" class="flex w-full max-w-md flex-col items-center gap-3">
  <tec-alert variant="success" role="status">
    <tec-icon name="check-circle2" slot="icon" aria-hidden="true" style="width:16px;height:16px"></tec-icon>
    <tec-alert-title>Three FDA alternatives ranked</tec-alert-title>
    <tec-alert-description>Alternative B has the lowest cost per barrel.</tec-alert-description>
    <tec-button slot="action" variant="ghost" size="xs">View</tec-button>
    <tec-button slot="action" variant="ghost" size="icon-sm" aria-label="Dismiss" data-dismiss>
      <tec-icon name="x" aria-hidden="true"></tec-icon>
    </tec-button>
  </tec-alert>
  <tec-alert variant="info" appearance="outline" role="status" dismissible>
    <tec-icon name="info" slot="icon" aria-hidden="true" style="width:16px;height:16px"></tec-icon>
    <tec-alert-title>Model out of date</tec-alert-title>
    <tec-alert-description>The built-in close button: the dismissible attribute.</tec-alert-description>
  </tec-alert>
  <tec-button variant="outline" size="sm" hidden data-show>Show alerts</tec-button>
</div>
<script type="module">
  import { CheckCircle2, Info, X } from "lucide"
  import { registerIcons } from "@tecton/wc/icon/registry.js"

  registerIcons({ CheckCircle2, Info, X })

  const root = document.getElementById("alert-dismissible")
  const show = root.querySelector("[data-show]")
  const alerts = [...root.querySelectorAll("tec-alert")]
  const sync = () => (show.hidden = alerts.some((alert) => !alert.hidden))
  root.querySelector("[data-dismiss]").addEventListener("click", () => {
    alerts[0].hidden = true
    sync()
    show.focus()
  })
  alerts[1].addEventListener("tec-dismiss", () => requestAnimationFrame(() => (sync(), show.focus())))
  show.addEventListener("click", () => {
    alerts.forEach((alert) => (alert.hidden = false))
    sync()
  })
</script>
