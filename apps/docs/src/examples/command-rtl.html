<tec-command class="max-w-sm" style="--tec-command-border-width: 1px" lang="ar">
  <tec-command-input placeholder="اكتب أمرًا أو ابحث..."></tec-command-input>
  <tec-command-list label="اقتراحات">
    <tec-command-group heading="اقتراحات">
      <tec-command-item><tec-icon name="calendar" aria-hidden="true" style="width:16px;height:16px"></tec-icon><span>التقويم</span></tec-command-item>
      <tec-command-item><tec-icon name="face-slightly-smiling" aria-hidden="true" style="width:16px;height:16px"></tec-icon><span>البحث عن الرموز التعبيرية</span></tec-command-item>
      <tec-command-item disabled><tec-icon name="calculator" aria-hidden="true" style="width:16px;height:16px"></tec-icon><span>الآلة الحاسبة</span></tec-command-item>
    </tec-command-group>
    <tec-command-separator></tec-command-separator>
    <tec-command-group heading="الإعدادات">
      <tec-command-item><tec-icon name="user" aria-hidden="true" style="width:16px;height:16px"></tec-icon><span>الملف الشخصي</span><tec-command-shortcut>⌘P</tec-command-shortcut></tec-command-item>
      <tec-command-item><tec-icon name="credit-card" aria-hidden="true" style="width:16px;height:16px"></tec-icon><span>الفوترة</span><tec-command-shortcut>⌘B</tec-command-shortcut></tec-command-item>
      <tec-command-item><tec-icon name="settings" aria-hidden="true" style="width:16px;height:16px"></tec-icon><span>الإعدادات</span><tec-command-shortcut>⌘S</tec-command-shortcut></tec-command-item>
    </tec-command-group>
    <tec-command-empty>لم يتم العثور على نتائج.</tec-command-empty>
  </tec-command-list>
</tec-command>
<script type="module">
  import { Calculator, Calendar, CreditCard, FaceSlightlySmiling, Settings, User } from "lucide"
  import { registerIcons } from "@tecton/wc/icon/registry.js"

  registerIcons({ Calculator, Calendar, CreditCard, FaceSlightlySmiling, Settings, User })
</script>
