<tec-card size="sm" class="mx-auto w-full max-w-xs">
  <tec-card-header>
    <tec-card-title>Scheduled reports</tec-card-title>
    <tec-card-description>Weekly snapshots. No more manual exports.</tec-card-description>
  </tec-card-header>
  <tec-card-content>
    <ul class="grid gap-2 py-2 text-sm">
      <li class="flex gap-2">
        <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" class="mt-0.5 size-4 shrink-0 text-muted-foreground rtl:rotate-180"><path d="m9 18 6-6-6-6"/></svg>
        <span>Choose a schedule (daily, or weekly).</span>
      </li>
      <li class="flex gap-2">
        <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" class="mt-0.5 size-4 shrink-0 text-muted-foreground rtl:rotate-180"><path d="m9 18 6-6-6-6"/></svg>
        <span>Send to channels or specific teammates.</span>
      </li>
      <li class="flex gap-2">
        <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" class="mt-0.5 size-4 shrink-0 text-muted-foreground rtl:rotate-180"><path d="m9 18 6-6-6-6"/></svg>
        <span>Include charts, tables, and key metrics.</span>
      </li>
    </ul>
  </tec-card-content>
  <tec-card-footer class="flex-col gap-2">
    <tec-button size="sm" class="w-full">Set up scheduled reports</tec-button>
    <tec-button variant="outline" size="sm" class="w-full">See what's new</tec-button>
  </tec-card-footer>
</tec-card>
