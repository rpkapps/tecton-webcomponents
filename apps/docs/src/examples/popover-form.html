<tec-popover align="start" style="--tec-popover-width: 16rem">
  <tec-button slot="trigger" variant="outline">Open Popover</tec-button>
  <tec-popover-header>
    <tec-popover-title>Dimensions</tec-popover-title>
    <tec-popover-description>Set the dimensions for the layer.</tec-popover-description>
  </tec-popover-header>
  <tec-field-group class="gap-4">
    <tec-field orientation="horizontal">
      <tec-field-label class="w-1/2">Width</tec-field-label>
      <tec-input value="100%"></tec-input>
    </tec-field>
    <tec-field orientation="horizontal">
      <tec-field-label class="w-1/2">Height</tec-field-label>
      <tec-input value="25px"></tec-input>
    </tec-field>
  </tec-field-group>
</tec-popover>
