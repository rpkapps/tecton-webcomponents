<tec-app-shell class="h-72 w-full max-w-3xl overflow-hidden rounded-lg border border-border">
  <tec-app-shell-header>
    <tec-app-shell-brand>
      {Hexagon}
      Tecton
    </tec-app-shell-brand>
    <tec-app-shell-nav aria-label="Application">
      <tec-button variant="ghost" size="sm">Wells</tec-button>
      <tec-button variant="ghost" size="sm">FDA</tec-button>
    </tec-app-shell-nav>
    <tec-app-shell-actions>
      <tec-app-shell-action label="Settings">
        {Settings}
      </tec-app-shell-action>
    </tec-app-shell-actions>
  </tec-app-shell-header>
  <tec-app-shell-body>
    <tec-app-shell-sidebar aria-label="Project" class="w-48">
      <div class="p-2">
        <tec-tree-view label="Project">
          <tec-tree-view-item value="wells" kind="folder" expanded>
            Wells
            <tec-tree-view-item value="a12">34/10-A-12</tec-tree-view-item>
          </tec-tree-view-item>
          <tec-tree-view-item value="horizons" kind="folder">Horizons</tec-tree-view-item>
        </tec-tree-view>
      </div>
    </tec-app-shell-sidebar>
    <tec-app-shell-main>
      <div class="p-4 text-sm text-muted-foreground">Map view</div>
    </tec-app-shell-main>
  </tec-app-shell-body>
</tec-app-shell>
