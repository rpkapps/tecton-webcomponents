<tec-canvas class="h-72 w-full max-w-2xl rounded-lg border border-border" lang="ar">
  <tec-canvas-surface class="bg-[radial-gradient(circle,var(--tec-border)_1px,transparent_1px)] bg-size-[20px_20px]"></tec-canvas-surface>
  <tec-canvas-overlay position="top-left">
    <tec-canvas-toolbar aria-label="التنقل">
      <tec-button variant="ghost" size="icon-sm" aria-label="تكبير">
        <tec-icon name="zoom-in" aria-hidden="true"></tec-icon>
      </tec-button>
      <tec-button variant="ghost" size="icon-sm" aria-label="تصغير">
        <tec-icon name="zoom-out" aria-hidden="true"></tec-icon>
      </tec-button>
    </tec-canvas-toolbar>
  </tec-canvas-overlay>
  <tec-canvas-overlay position="top">
    <tec-canvas-toolbar orientation="horizontal" aria-label="الأدوات">
      <tec-button variant="ghost" size="icon-sm" aria-label="تحريك">
        <tec-icon name="hand" aria-hidden="true"></tec-icon>
      </tec-button>
      <tec-button variant="ghost" size="icon-sm" aria-label="قياس">
        <tec-icon name="ruler" aria-hidden="true"></tec-icon>
      </tec-button>
    </tec-canvas-toolbar>
  </tec-canvas-overlay>
  <tec-canvas-overlay position="bottom-right">
    <tec-canvas-legend aria-label="مفتاح الخريطة">
      <tec-canvas-legend-item swatch="var(--tec-chart-1)">الحقول الحالية</tec-canvas-legend-item>
      <tec-canvas-legend-item swatch="var(--tec-chart-2)">الحوض الفرعي</tec-canvas-legend-item>
    </tec-canvas-legend>
  </tec-canvas-overlay>
</tec-canvas>
<script type="module">
  import { Hand, Ruler, ZoomIn, ZoomOut } from "lucide"
  import { registerIcons } from "@tecton/wc/icon/registry.js"

  registerIcons({ Hand, Ruler, ZoomIn, ZoomOut })
</script>
