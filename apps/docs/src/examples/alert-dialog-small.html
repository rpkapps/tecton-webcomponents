<tec-alert-dialog size="sm">

  <tec-alert-dialog-header>
    <tec-alert-dialog-title>Allow accessory to connect?</tec-alert-dialog-title>
    <tec-alert-dialog-description>
      Do you want to allow the USB accessory to connect to this device?

</tec-alert-dialog>
