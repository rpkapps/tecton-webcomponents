<tec-tree-view label="Horizons" class="max-w-sm">
  <tec-tree-view-item value="horizons" kind="folder" expanded>
    Horizons
    <tec-tree-view-action slot="end" aria-label="More"></tec-tree-view-action>
    <tec-tree-view-item value="balder">
      <tec-color-swatch slot="color-tag" color="var(--tec-chart-2)" label="Top Balder colour"></tec-color-swatch>
      Top Balder
      <tec-badge slot="suffix" variant="info">12 picks</tec-badge>
      <tec-tree-view-visibility-toggle slot="end"></tec-tree-view-visibility-toggle>
      <tec-tree-view-action slot="end" aria-label="Top Balder actions"></tec-tree-view-action>
    </tec-tree-view-item>
    <tec-tree-view-item value="sele">
      <tec-color-swatch slot="color-tag" color="var(--tec-chart-1)" label="Top Sele colour"></tec-color-swatch>
      Top Sele
      <tec-badge slot="suffix" variant="info">8 picks</tec-badge>
      <tec-tree-view-visibility-toggle slot="end"></tec-tree-view-visibility-toggle>
      <tec-tree-view-action slot="end" aria-label="Top Sele actions"></tec-tree-view-action>
    </tec-tree-view-item>
    <tec-tree-view-item value="bcu" dimmed>
      <tec-color-swatch slot="color-tag" color="var(--tec-chart-3)" label="Base Cretaceous colour"></tec-color-swatch>
      Base Cretaceous
      <tec-tree-view-visibility-toggle slot="end" pressed></tec-tree-view-visibility-toggle>
      <tec-tree-view-action slot="end" aria-label="Base Cretaceous actions"></tec-tree-view-action>
    </tec-tree-view-item>
  </tec-tree-view-item>
</tec-tree-view>
