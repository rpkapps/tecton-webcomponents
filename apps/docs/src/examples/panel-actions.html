<div class="flex w-full max-w-md flex-col gap-2">
  <!-- Drag the corner: the icons move into the More menu, lowest priority first. -->
  <div class="min-w-48 resize-x overflow-hidden">
    <tec-panel>
      <tec-panel-header>
        <tec-panel-title>Production forecast</tec-panel-title>
        <tec-panel-actions>
          <!-- Icon-only actions: labels="never" gives every button its tooltip. A custom More
               button keeps the panel's small button size. -->
          <tec-toolbar aria-label="Panel actions" labels="never" style="--tec-overflow-gap: 0.25rem">
            <tec-overflow-item value="refresh" label="Refresh" priority="2">
              <tec-button variant="ghost" size="icon-sm" aria-label="Refresh"><tec-icon name="refresh-cw" aria-hidden="true"></tec-icon></tec-button>
            </tec-overflow-item>
            <tec-overflow-item value="pin" label="Pin" priority="1">
              <tec-button variant="ghost" size="icon-sm" aria-label="Pin"><tec-icon name="pin" aria-hidden="true"></tec-icon></tec-button>
            </tec-overflow-item>
            <tec-overflow-item value="share" label="Share">
              <tec-button variant="ghost" size="icon-sm" aria-label="Share"><tec-icon name="share" aria-hidden="true"></tec-icon></tec-button>
            </tec-overflow-item>
            <tec-overflow-item value="export" label="Export">
              <tec-button variant="ghost" size="icon-sm" aria-label="Export"><tec-icon name="download" aria-hidden="true"></tec-icon></tec-button>
            </tec-overflow-item>
            <tec-overflow-item value="maximize" label="Maximize">
              <tec-button variant="ghost" size="icon-sm" aria-label="Maximize"><tec-icon name="maximize" aria-hidden="true"></tec-icon></tec-button>
            </tec-overflow-item>
            <!-- Not wrapped: settings never leaves the header. -->
            <tec-button variant="ghost" size="icon-sm" aria-label="Settings"><tec-icon name="settings" aria-hidden="true"></tec-icon></tec-button>
            <tec-button slot="menu-trigger" variant="ghost" size="icon-sm" aria-label="More actions"><tec-icon name="ellipsis" aria-hidden="true"></tec-icon></tec-button>
          </tec-toolbar>
        </tec-panel-actions>
      </tec-panel-header>
      <tec-panel-content class="text-sm text-muted-foreground">34/10-A-12 · 1 240 bbl/d · updated 5 min ago</tec-panel-content>
    </tec-panel>
  </div>
  <p class="text-xs text-muted-foreground">Drag the corner to resize.</p>
</div>
<script type="module">
  import { Download, Ellipsis, Maximize, Pin, RefreshCw, Settings, Share } from "lucide"
  import { registerIcons } from "@tecton/wc/icon/registry.js"

  registerIcons({ Download, Ellipsis, Maximize, Pin, RefreshCw, Settings, Share })
</script>
