<div class="mx-auto flex w-full max-w-sm flex-col gap-2 py-12">
  <tec-attachment state="idle" class="w-full">
    <tec-attachment-media><tec-icon name="clock" aria-hidden="true" style="width:16px;height:16px"></tec-icon></tec-attachment-media>
    <tec-attachment-content>
      <tec-attachment-title>selected-file.pdf</tec-attachment-title>
      <tec-attachment-description>Ready to upload</tec-attachment-description>
    </tec-attachment-content>
    <tec-attachment-actions>
      <tec-attachment-action aria-label="Remove selected-file.pdf"><tec-icon name="x" aria-hidden="true" style="width:16px;height:16px"></tec-icon></tec-attachment-action>
    </tec-attachment-actions>
  </tec-attachment>
  <tec-attachment state="uploading" class="w-full">
    <tec-attachment-media><tec-spinner></tec-spinner></tec-attachment-media>
    <tec-attachment-content>
      <tec-attachment-title>design-system.zip</tec-attachment-title>
      <tec-attachment-description>Uploading · 64%</tec-attachment-description>
    </tec-attachment-content>
    <tec-attachment-actions>
      <tec-attachment-action aria-label="Cancel upload of design-system.zip"><tec-icon name="x" aria-hidden="true" style="width:16px;height:16px"></tec-icon></tec-attachment-action>
    </tec-attachment-actions>
  </tec-attachment>
  <tec-attachment state="processing" class="w-full">
    <tec-attachment-media><tec-icon name="file-text" aria-hidden="true" style="width:16px;height:16px"></tec-icon></tec-attachment-media>
    <tec-attachment-content>
      <tec-attachment-title>market-research.pdf</tec-attachment-title>
      <tec-attachment-description>Processing document</tec-attachment-description>
    </tec-attachment-content>
    <tec-attachment-actions>
      <tec-attachment-action aria-label="Remove market-research.pdf"><tec-icon name="x" aria-hidden="true" style="width:16px;height:16px"></tec-icon></tec-attachment-action>
    </tec-attachment-actions>
  </tec-attachment>
  <tec-attachment state="error" class="w-full">
    <tec-attachment-media><tec-icon name="file-exclamation-point" aria-hidden="true" style="width:16px;height:16px"></tec-icon></tec-attachment-media>
    <tec-attachment-content>
      <tec-attachment-title>financial-model.xlsx</tec-attachment-title>
      <tec-attachment-description>Upload failed. Try again.</tec-attachment-description>
    </tec-attachment-content>
    <tec-attachment-actions>
      <tec-attachment-action aria-label="Retry upload of financial-model.xlsx"><tec-icon name="refresh-cw" aria-hidden="true" style="width:16px;height:16px"></tec-icon></tec-attachment-action>
      <tec-attachment-action aria-label="Remove financial-model.xlsx"><tec-icon name="x" aria-hidden="true" style="width:16px;height:16px"></tec-icon></tec-attachment-action>
    </tec-attachment-actions>
  </tec-attachment>
  <tec-attachment state="done" class="w-full">
    <tec-attachment-media><tec-icon name="check" aria-hidden="true" style="width:16px;height:16px"></tec-icon></tec-attachment-media>
    <tec-attachment-content>
      <tec-attachment-title>uploaded-report.pdf</tec-attachment-title>
      <tec-attachment-description>Uploaded · 1.8 MB</tec-attachment-description>
    </tec-attachment-content>
    <tec-attachment-actions>
      <tec-attachment-action aria-label="Remove uploaded-report.pdf"><tec-icon name="x" aria-hidden="true" style="width:16px;height:16px"></tec-icon></tec-attachment-action>
    </tec-attachment-actions>
  </tec-attachment>
</div>
<script type="module">
  import { Check, Clock, FileExclamationPoint, FileText, RefreshCw, X } from "lucide"
  import { registerIcons } from "@tecton/wc/icon/registry.js"

  registerIcons({ Check, Clock, FileExclamationPoint, FileText, RefreshCw, X })
</script>
