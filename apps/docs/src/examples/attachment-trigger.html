<div id="attachment-trigger" class="mx-auto w-full max-w-sm py-12">
  <tec-attachment class="w-full">
    <tec-attachment-media><tec-icon name="file-search" aria-hidden="true" style="width:16px;height:16px"></tec-icon></tec-attachment-media>
    <tec-attachment-content>
      <tec-attachment-title>research-summary.pdf</tec-attachment-title>
      <tec-attachment-description>Open preview dialog</tec-attachment-description>
    </tec-attachment-content>
    <tec-attachment-actions>
      <tec-attachment-action aria-label="Copy link to research-summary.pdf"><tec-icon name="copy" aria-hidden="true" style="width:16px;height:16px"></tec-icon></tec-attachment-action>
      <tec-attachment-action aria-label="Remove research-summary.pdf"><tec-icon name="x" aria-hidden="true" style="width:16px;height:16px"></tec-icon></tec-attachment-action>
    </tec-attachment-actions>
    <tec-attachment-trigger aria-label="Preview research-summary.pdf"></tec-attachment-trigger>
  </tec-attachment>
  <tec-dialog class="sm:max-w-md">
    <tec-dialog-header>
      <tec-dialog-title>research-summary.pdf</tec-dialog-title>
      <tec-dialog-description>The attachment trigger fills the card and opens the dialog, while the actions stay independently clickable above it.</tec-dialog-description>
    </tec-dialog-header>
  </tec-dialog>
</div>
<script type="module">
  import { Copy, FileSearch, X } from "lucide"
  import { registerIcons } from "@tecton/wc/icon/registry.js"

  registerIcons({ Copy, FileSearch, X })

  const root = document.getElementById("attachment-trigger")
  root.querySelector("tec-attachment-trigger").addEventListener("click", () => root.querySelector("tec-dialog").show())
</script>
