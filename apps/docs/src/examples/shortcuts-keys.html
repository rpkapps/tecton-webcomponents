<div class="grid w-full max-w-sm grid-cols-[1fr_auto] items-center gap-x-6 gap-y-3 text-sm">
  <span>Search</span>
  <tec-shortcut-keys keys="mod+k"></tec-shortcut-keys>
  <span>Show shortcuts</span>
  <tec-shortcut-keys keys="?"></tec-shortcut-keys>
  <span>Command palette</span>
  <tec-shortcut-keys keys="ctrl+shift+p"></tec-shortcut-keys>
  <span>Go to wells</span>
  <tec-shortcut-keys keys="g w"></tec-shortcut-keys>
  <span>Confirm</span>
  <tec-shortcut-keys keys="alt+enter"></tec-shortcut-keys>
  <span>Search (as on a Mac)</span>
  <tec-shortcut-keys keys="mod+k" platform="mac"></tec-shortcut-keys>
</div>
