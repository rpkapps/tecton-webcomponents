<div id="input-group-button" class="grid w-full max-w-sm gap-6">
  <tec-input-group>
    <tec-input-group-input value="https://x.com/shadcn" readonly aria-label="Profile URL"></tec-input-group-input>
    <tec-input-group-addon align="inline-end">
      <tec-input-group-button size="icon-xs" aria-label="Copy" data-action="copy"><tec-icon name="copy" aria-hidden="true" style="width:16px;height:16px"></tec-icon></tec-input-group-button>
    </tec-input-group-addon>
  </tec-input-group>
  <tec-input-group class="[--tec-radius-md:9999px] [--tec-radius-sm:9999px]">
    <tec-input-group-input aria-label="Website"></tec-input-group-input>
    <tec-input-group-addon>
      <tec-popover>
        <tec-input-group-button slot="trigger" variant="secondary" size="icon-xs" aria-label="Connection info"><tec-icon name="info" aria-hidden="true" style="width:16px;height:16px"></tec-icon></tec-input-group-button>
        <div class="flex flex-col gap-1 text-sm">
          <p class="font-medium">Your connection is not secure.</p>
          <p>You should not enter any sensitive information on this site.</p>
        </div>
      </tec-popover>
    </tec-input-group-addon>
    <tec-input-group-addon class="text-muted-foreground">https://</tec-input-group-addon>
    <tec-input-group-addon align="inline-end">
      <tec-input-group-button size="icon-xs" aria-label="Favorite" aria-pressed="false" data-action="favorite" class="[&[aria-pressed=true]_tec-icon::part(svg)]:fill-blue-560 [&[aria-pressed=true]_tec-icon]:text-blue-560"><tec-icon name="star" aria-hidden="true" style="width:16px;height:16px"></tec-icon></tec-input-group-button>
    </tec-input-group-addon>
  </tec-input-group>
  <tec-input-group>
    <tec-input-group-input placeholder="Type to search..." aria-label="Search"></tec-input-group-input>
    <tec-input-group-addon align="inline-end">
      <tec-input-group-button variant="secondary">Search</tec-input-group-button>
    </tec-input-group-addon>
  </tec-input-group>
</div>
<script type="module">
  import { Copy, Info, Star } from "lucide"
  import { registerIcons } from "@tecton/wc/icon/registry.js"

  registerIcons({ Copy, Info, Star })

  const root = document.getElementById("input-group-button")
  const copy = root.querySelector("[data-action=copy]")
  copy.addEventListener("click", async () => {
    await navigator.clipboard?.writeText("https://x.com/shadcn").catch(() => {})
    copy.setAttribute("aria-label", "Copied")
    setTimeout(() => copy.setAttribute("aria-label", "Copy"), 2000)
  })
  const favorite = root.querySelector("[data-action=favorite]")
  favorite.addEventListener("click", () => {
    const on = favorite.getAttribute("aria-pressed") !== "true"
    favorite.setAttribute("aria-pressed", String(on))
  })
</script>
