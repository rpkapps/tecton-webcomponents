<div id="input-group-button" class="grid w-full max-w-sm gap-6">
  <tec-input-group>
    <tec-input-group-input value="https://x.com/shadcn" readonly aria-label="Profile URL"></tec-input-group-input>
    <tec-input-group-addon align="inline-end">
      <tec-input-group-button size="icon-xs" aria-label="Copy" data-action="copy"><svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect width="14" height="14" x="8" y="8" rx="2" ry="2" /><path d="M4 16c-1.1 0-2-.9-2-2V4c0-1.1.9-2 2-2h10c1.1 0 2 .9 2 2" /></svg></tec-input-group-button>
    </tec-input-group-addon>
  </tec-input-group>
  <tec-input-group class="[--tec-radius-md:9999px] [--tec-radius-sm:9999px]">
    <tec-input-group-input aria-label="Website"></tec-input-group-input>
    <tec-input-group-addon>
      <tec-popover>
        <tec-input-group-button slot="trigger" variant="secondary" size="icon-xs" aria-label="Connection info"><svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="10" /><path d="M12 16v-4" /><path d="M12 8h.01" /></svg></tec-input-group-button>
        <div class="flex flex-col gap-1 text-sm">
          <p class="font-medium">Your connection is not secure.</p>
          <p>You should not enter any sensitive information on this site.</p>
        </div>
      </tec-popover>
    </tec-input-group-addon>
    <tec-input-group-addon class="text-muted-foreground">https://</tec-input-group-addon>
    <tec-input-group-addon align="inline-end">
      <tec-input-group-button size="icon-xs" aria-label="Favorite" aria-pressed="false" data-action="favorite"><svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M11.525 2.295a.53.53 0 0 1 .95 0l2.31 4.679a2.123 2.123 0 0 0 1.595 1.16l5.166.756a.53.53 0 0 1 .294.904l-3.736 3.638a2.123 2.123 0 0 0-.611 1.878l.882 5.14a.53.53 0 0 1-.771.56l-4.618-2.428a2.122 2.122 0 0 0-1.973 0L6.396 21.01a.53.53 0 0 1-.77-.56l.881-5.139a2.122 2.122 0 0 0-.611-1.879L2.16 9.795a.53.53 0 0 1 .294-.906l5.165-.755a2.122 2.122 0 0 0 1.597-1.16z" /></svg></tec-input-group-button>
    </tec-input-group-addon>
  </tec-input-group>
  <tec-input-group>
    <tec-input-group-input placeholder="Type to search..." aria-label="Search"></tec-input-group-input>
    <tec-input-group-addon align="inline-end">
      <tec-input-group-button variant="secondary">Search</tec-input-group-button>
    </tec-input-group-addon>
  </tec-input-group>
</div>
<script type="module">
  const root = document.getElementById("input-group-button")
  const copy = root.querySelector("[data-action=copy]")
  copy.addEventListener("click", async () => {
    await navigator.clipboard?.writeText("https://x.com/shadcn").catch(() => {})
    copy.setAttribute("aria-label", "Copied")
    setTimeout(() => copy.setAttribute("aria-label", "Copy"), 2000)
  })
  const favorite = root.querySelector("[data-action=favorite]")
  favorite.addEventListener("click", () => {
    const on = favorite.getAttribute("aria-pressed") !== "true"
    favorite.setAttribute("aria-pressed", String(on))
    favorite.querySelector("svg").classList.toggle("fill-blue-560", on)
    favorite.querySelector("svg").classList.toggle("stroke-blue-560", on)
  })
</script>
