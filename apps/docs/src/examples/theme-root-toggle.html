<tec-theme-root id="theme-root-toggle" theme="system" storage-key="theme-root-toggle-demo" class="block w-full max-w-md rounded-lg border border-border bg-background p-4">
  <div class="flex flex-col gap-4 text-sm">
    <div class="flex items-center justify-between gap-4">
      <span class="font-medium">Appearance</span>
      <tec-toggle-group variant="outline" size="sm" value="system" aria-label="Theme">
        <tec-toggle-group-item value="light" aria-label="Light">
          <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="4"/><path d="M12 2v2"/><path d="M12 20v2"/><path d="m4.93 4.93 1.41 1.41"/><path d="m17.66 17.66 1.41 1.41"/><path d="M2 12h2"/><path d="M20 12h2"/><path d="m6.34 17.66-1.41 1.41"/><path d="m19.07 4.93-1.41 1.41"/></svg>
        </tec-toggle-group-item>
        <tec-toggle-group-item value="dark" aria-label="Dark">
          <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M20.985 12.486a9 9 0 1 1-9.473-9.472c.405-.022.617.46.402.803a6 6 0 0 0 8.268 8.268c.344-.215.825-.004.803.401"/></svg>
        </tec-toggle-group-item>
        <tec-toggle-group-item value="system" aria-label="System">
          <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect width="20" height="14" x="2" y="3" rx="2"/><line x1="8" x2="16" y1="21" y2="21"/><line x1="12" x2="12" y1="17" y2="21"/></svg>
        </tec-toggle-group-item>
      </tec-toggle-group>
    </div>
    <p class="text-muted-foreground">The choice is stored in <code>localStorage</code> and restored on the next visit; <em>System</em> follows the operating system live.</p>
  </div>
</tec-theme-root>
<script type="module">
  const root = document.getElementById("theme-root-toggle")
  const group = root.querySelector("tec-toggle-group")
  group.value = root.theme
  group.addEventListener("tec-value-change", (event) => {
    // Keep one option selected: ignore the click that would clear the selection.
    if (!event.detail.value) return event.preventDefault()
    root.theme = event.detail.value
  })
</script>
