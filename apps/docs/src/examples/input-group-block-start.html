<tec-field-group class="max-w-sm">
  <tec-field>
    <tec-field-label>Input</tec-field-label>
    <tec-input-group>
      <tec-input-group-input placeholder="Enter your name"></tec-input-group-input>
      <tec-input-group-addon align="block-start">
        <tec-input-group-text>Full Name</tec-input-group-text>
      </tec-input-group-addon>
    </tec-input-group>
    <tec-field-description>Header positioned above the input.</tec-field-description>
  </tec-field>
  <tec-field>
    <tec-field-label>Textarea</tec-field-label>
    <tec-input-group>
      <tec-input-group-textarea placeholder="console.log('Hello, world!');" class="font-mono text-sm"></tec-input-group-textarea>
      <tec-input-group-addon align="block-start">
        <span class="text-muted-foreground"><tec-icon name="file-code" aria-hidden="true" style="width:16px;height:16px"></tec-icon></span>
        <tec-input-group-text class="font-mono">script.js</tec-input-group-text>
        <tec-input-group-button size="icon-xs" class="ms-auto" aria-label="Copy"><tec-icon name="copy" aria-hidden="true" style="width:16px;height:16px"></tec-icon></tec-input-group-button>
      </tec-input-group-addon>
    </tec-input-group>
    <tec-field-description>Header positioned above the textarea.</tec-field-description>
  </tec-field>
</tec-field-group>
<script type="module">
  import { Copy, FileCode } from "lucide"
  import { registerIcons } from "@tecton/wc/icon/registry.js"

  registerIcons({ Copy, FileCode })
</script>
