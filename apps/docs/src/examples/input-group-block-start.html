<tec-field-group class="max-w-sm">
  <tec-field>
    <tec-field-label>Input</tec-field-label>
    <tec-input-group>
      <tec-input-group-input placeholder="Enter your name"></tec-input-group-input>
      <tec-input-group-addon align="block-start">
        <tec-input-group-text>Full Name</tec-input-group-text>
      </tec-input-group-addon>
    </tec-input-group>
    <tec-field-description>Header positioned above the input.</tec-field-description>
  </tec-field>
  <tec-field>
    <tec-field-label>Textarea</tec-field-label>
    <tec-input-group>
      <tec-input-group-textarea placeholder="console.log('Hello, world!');" class="font-mono text-sm"></tec-input-group-textarea>
      <tec-input-group-addon align="block-start">
        <span class="text-muted-foreground"><svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M6 22a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h8a2.4 2.4 0 0 1 1.704.706l3.588 3.588A2.4 2.4 0 0 1 20 8v12a2 2 0 0 1-2 2z" /><path d="M14 2v5a1 1 0 0 0 1 1h5" /><path d="M10 12.5 8 15l2 2.5" /><path d="m14 12.5 2 2.5-2 2.5" /></svg></span>
        <tec-input-group-text class="font-mono">script.js</tec-input-group-text>
        <tec-input-group-button size="icon-xs" class="ms-auto" aria-label="Copy"><svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect width="14" height="14" x="8" y="8" rx="2" ry="2" /><path d="M4 16c-1.1 0-2-.9-2-2V4c0-1.1.9-2 2-2h10c1.1 0 2 .9 2 2" /></svg></tec-input-group-button>
      </tec-input-group-addon>
    </tec-input-group>
    <tec-field-description>Header positioned above the textarea.</tec-field-description>
  </tec-field>
</tec-field-group>
