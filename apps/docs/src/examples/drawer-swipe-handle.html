<tec-drawer show-swipe-handle>
  <tec-button slot="trigger" variant="secondary">Open Drawer</tec-button>
  <tec-drawer-header>
    <tec-drawer-title>Drawer</tec-drawer-title>
    <tec-drawer-description>Drawer with a swipe handle.</tec-drawer-description>
  </tec-drawer-header>
  <div class="flex-1 p-4">
    <div class="h-80 w-full rounded-2xl bg-muted"></div>
  </div>
  <tec-drawer-footer>
    <tec-drawer-close variant="default">Close</tec-drawer-close>
  </tec-drawer-footer>
</tec-drawer>
