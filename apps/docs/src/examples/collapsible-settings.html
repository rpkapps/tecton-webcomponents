<tec-card size="sm" class="mx-auto w-full max-w-xs">
  <tec-card-header>
    <tec-card-title>Radius</tec-card-title>
    <tec-card-description>Set the corner radius of the element.</tec-card-description>
  </tec-card-header>
  <tec-card-content>
    <tec-collapsible class="flex items-start gap-2">
      <div class="grid w-full grid-cols-2 gap-2">
        <tec-input aria-label="Radius X" placeholder="0" value="0"></tec-input>
        <tec-input aria-label="Radius Y" placeholder="0" value="0"></tec-input>
        <tec-collapsible-content class="col-span-full">
          <div class="grid grid-cols-2 gap-2">
            <tec-input aria-label="Radius X, bottom" placeholder="0" value="0"></tec-input>
            <tec-input aria-label="Radius Y, bottom" placeholder="0" value="0"></tec-input>
          </div>
        </tec-collapsible-content>
      </div>
      <tec-collapsible-trigger>
        <tec-button variant="outline" size="icon" aria-label="Edit each corner">
          <svg class="[tec-collapsible[open]_&]:hidden" xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M8 3H5a2 2 0 0 0-2 2v3"/><path d="M21 8V5a2 2 0 0 0-2-2h-3"/><path d="M3 16v3a2 2 0 0 0 2 2h3"/><path d="M16 21h3a2 2 0 0 0 2-2v-3"/></svg>
          <svg class="hidden [tec-collapsible[open]_&]:block" xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M8 3v3a2 2 0 0 1-2 2H3"/><path d="M21 8h-3a2 2 0 0 1-2-2V3"/><path d="M3 16h3a2 2 0 0 1 2 2v3"/><path d="M16 21v-3a2 2 0 0 1 2-2h3"/></svg>
        </tec-button>
      </tec-collapsible-trigger>
    </tec-collapsible>
  </tec-card-content>
</tec-card>
