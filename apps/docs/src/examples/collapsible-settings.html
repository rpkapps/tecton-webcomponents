<tec-card size="sm" class="mx-auto w-full max-w-xs">
  <tec-card-header>
    <tec-card-title>Radius</tec-card-title>
    <tec-card-description>Set the corner radius of the element.</tec-card-description>
  </tec-card-header>
  <tec-card-content>
    <tec-collapsible class="flex items-start gap-2">
      <div class="grid w-full grid-cols-2 gap-2">
        <tec-input aria-label="Radius X" placeholder="0" value="0"></tec-input>
        <tec-input aria-label="Radius Y" placeholder="0" value="0"></tec-input>
        <tec-collapsible-content class="col-span-full">
          <div class="grid grid-cols-2 gap-2">
            <tec-input aria-label="Radius X, bottom" placeholder="0" value="0"></tec-input>
            <tec-input aria-label="Radius Y, bottom" placeholder="0" value="0"></tec-input>
          </div>
        </tec-collapsible-content>
      </div>
      <tec-collapsible-trigger>
        <tec-button variant="outline" size="icon" aria-label="Edit each corner">
          <tec-icon name="maximize" class="[tec-collapsible[open]_&]:hidden" aria-hidden="true"></tec-icon>
          <tec-icon name="minimize" class="hidden [tec-collapsible[open]_&]:block" aria-hidden="true"></tec-icon>
        </tec-button>
      </tec-collapsible-trigger>
    </tec-collapsible>
  </tec-card-content>
</tec-card>
<script type="module">
  import { Maximize, Minimize } from "lucide"
  import { registerIcons } from "@tecton/wc/icon/registry.js"

  registerIcons({ Maximize, Minimize })
</script>
