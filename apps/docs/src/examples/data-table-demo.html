<div id="data-table-demo" class="w-full">
  <tec-data-table
    label="Payments"
    selectable
    filterable
    filter-column="email"
    filter-placeholder="Filter emails..."
    column-menu
    pagination
    pager="text"
  ></tec-data-table>
</div>
<script type="module">
  import { Ellipsis } from "lucide"
  import { registerIcons } from "@tecton/wc/icon/registry.js"

  registerIcons({ Ellipsis })

  import { html } from "@tecton/wc/data-table/data-table.js"

  const data = [
    { id: "m5gr84i9", amount: 316, status: "success", email: "ken99@example.com" },
    { id: "3u1reuv4", amount: 242, status: "success", email: "Abe45@example.com" },
    { id: "derv1ws0", amount: 837, status: "processing", email: "Monserrat44@example.com" },
    { id: "5kma53ae", amount: 874, status: "success", email: "Silas22@example.com" },
    { id: "bhqecj4p", amount: 721, status: "failed", email: "carmella@example.com" },
  ]

  const currency = new Intl.NumberFormat("en-US", { style: "currency", currency: "USD" })
  const table = document.querySelector("#data-table-demo tec-data-table")

  table.columns = [
    { accessor: "status", header: "Status", cell: ({ value }) => html`<span class="capitalize">${value}</span>` },
    { accessor: "email", header: "Email", sortable: true, rowHeader: true, cell: ({ value }) => html`<span class="font-normal lowercase">${value}</span>` },
    { accessor: "amount", header: "Amount", align: "end", cell: ({ value }) => html`<span class="font-medium">${currency.format(value)}</span>` },
    {
      id: "actions",
      label: "Actions",
      hideable: false,
      cell: ({ row }) => html`<tec-dropdown-menu side="bottom" align="end" class="[--tec-dropdown-menu-width:11rem]">
        <tec-button slot="trigger" variant="ghost" size="icon-xs" aria-label="Open menu">
          <tec-icon name="ellipsis" aria-hidden="true" style="width:16px;height:16px"></tec-icon>
        </tec-button>
        <tec-dropdown-menu-group>
          <tec-dropdown-menu-label>Actions</tec-dropdown-menu-label>
          <tec-dropdown-menu-item @tec-select=${() => navigator.clipboard.writeText(row.id)}>Copy payment ID</tec-dropdown-menu-item>
        </tec-dropdown-menu-group>
        <tec-dropdown-menu-separator></tec-dropdown-menu-separator>
        <tec-dropdown-menu-item>View customer</tec-dropdown-menu-item>
        <tec-dropdown-menu-item>View payment details</tec-dropdown-menu-item>
      </tec-dropdown-menu>`,
    },
  ]
  table.data = data
</script>
