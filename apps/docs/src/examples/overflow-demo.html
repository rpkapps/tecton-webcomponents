<div class="flex w-full max-w-2xl flex-col gap-2">
  <!-- Drag the corner: the row collapses labels first, then moves items into the More menu. -->
  <div class="min-w-40 resize-x overflow-hidden rounded-md border border-border p-2">
    <tec-toolbar aria-label="Well actions">
      <tec-overflow-item value="tag" priority="2">
        <tec-button variant="outline"><svg slot="start" xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12.586 2.586A2 2 0 0 0 11.172 2H4a2 2 0 0 0-2 2v7.172a2 2 0 0 0 .586 1.414l8.704 8.704a2.426 2.426 0 0 0 3.42 0l6.58-6.58a2.426 2.426 0 0 0 0-3.42z"/><circle cx="7.5" cy="7.5" r=".5" fill="currentColor"/></svg><tec-overflow-label>Add tag</tec-overflow-label></tec-button>
      </tec-overflow-item>
      <tec-overflow-item value="share" priority="1">
        <tec-button variant="outline"><svg slot="start" xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 2v13"/><path d="m16 6-4-4-4 4"/><path d="M4 12v8a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2v-8"/></svg><tec-overflow-label>Share</tec-overflow-label></tec-button>
      </tec-overflow-item>
      <tec-overflow-item value="copy">
        <tec-button variant="outline"><svg slot="start" xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect width="14" height="14" x="8" y="8" rx="2" ry="2"/><path d="M4 16c-1.1 0-2-.9-2-2V4c0-1.1.9-2 2-2h10c1.1 0 2 .9 2 2"/></svg><tec-overflow-label>Duplicate</tec-overflow-label></tec-button>
      </tec-overflow-item>
      <tec-overflow-item value="export">
        <tec-button variant="outline"><svg slot="start" xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 15V3"/><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><path d="m7 10 5 5 5-5"/></svg><tec-overflow-label>Export</tec-overflow-label></tec-button>
      </tec-overflow-item>
      <tec-overflow-item value="archive">
        <tec-button variant="outline"><svg slot="start" xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect width="20" height="5" x="2" y="3" rx="1"/><path d="M4 8v11a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8"/><path d="M10 12h4"/></svg><tec-overflow-label>Archive</tec-overflow-label></tec-button>
      </tec-overflow-item>
      <tec-overflow-divider></tec-overflow-divider>
      <tec-overflow-item value="delete" label-behavior="keep">
        <tec-button variant="destructive"><svg slot="start" xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M10 11v6"/><path d="M14 11v6"/><path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6"/><path d="M3 6h18"/><path d="M8 6V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"/></svg>Delete</tec-button>
      </tec-overflow-item>
      <!-- Not wrapped: the primary action never leaves the row. -->
      <tec-button><svg slot="start" xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 12h14"/><path d="M12 5v14"/></svg>New well</tec-button>
    </tec-toolbar>
  </div>
  <p class="text-xs text-muted-foreground">Drag the corner to resize.</p>
</div>
