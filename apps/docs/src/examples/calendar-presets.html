<tec-card id="calendar-presets" size="sm" class="mx-auto w-fit max-w-[300px]">
  <tec-card-content>
    <tec-calendar fixed-weeks class="[--tec-calendar-cell-size:2.375rem] [--tec-calendar-padding:0]"></tec-calendar>
  </tec-card-content>
  <tec-card-footer class="flex flex-wrap gap-2 border-t">
    <tec-button variant="outline" size="sm" class="flex-1" data-days="0">Today</tec-button>
    <tec-button variant="outline" size="sm" class="flex-1" data-days="1">Tomorrow</tec-button>
    <tec-button variant="outline" size="sm" class="flex-1" data-days="3">In 3 days</tec-button>
    <tec-button variant="outline" size="sm" class="flex-1" data-days="7">In a week</tec-button>
    <tec-button variant="outline" size="sm" class="flex-1" data-days="14">In 2 weeks</tec-button>
  </tec-card-footer>
</tec-card>
<script type="module">
  const root = document.getElementById("calendar-presets")
  const calendar = root.querySelector("tec-calendar")
  const iso = (d) => `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, "0")}-${String(d.getDate()).padStart(2, "0")}`
  calendar.value = `${new Date().getFullYear()}-02-12`
  // Open on the current month even though the selected day is in February.
  calendar.focusedDate = iso(new Date())
  for (const button of root.querySelectorAll("[data-days]")) {
    button.addEventListener("click", () => {
      const date = new Date()
      date.setDate(date.getDate() + Number(button.dataset.days))
      // Select the day and show its month.
      calendar.value = iso(date)
      calendar.focusedDate = iso(date)
    })
  }
</script>
