<tec-drawer snap-points="31rem 1" show-swipe-handle>
  <tec-button slot="trigger" variant="outline">Open Snap Drawer</tec-button>
  <tec-drawer-header>
    <tec-drawer-title>Snap points</tec-drawer-title>
    <tec-drawer-description>Drag the drawer to snap between a compact peek and a near full-height view.</tec-drawer-description>
  </tec-drawer-header>
  <div class="flex-1 p-4">
    <div class="h-80 w-full rounded-2xl bg-muted"></div>
  </div>
  <tec-drawer-footer>
    <tec-drawer-close variant="default">Close</tec-drawer-close>
  </tec-drawer-footer>
</tec-drawer>
