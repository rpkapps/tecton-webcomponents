<tec-toggle-group multiple orientation="vertical" spacing="1" value="bold italic" aria-label="Text formatting">
  <tec-toggle-group-item value="bold" aria-label="Toggle bold">
    <tec-icon name="bold" aria-hidden="true" style="width:16px;height:16px"></tec-icon>
  </tec-toggle-group-item>
  <tec-toggle-group-item value="italic" aria-label="Toggle italic">
    <tec-icon name="italic" aria-hidden="true" style="width:16px;height:16px"></tec-icon>
  </tec-toggle-group-item>
  <tec-toggle-group-item value="underline" aria-label="Toggle underline">
    <tec-icon name="underline" aria-hidden="true" style="width:16px;height:16px"></tec-icon>
  </tec-toggle-group-item>
</tec-toggle-group>
<script type="module">
  import { Bold, Italic, Underline } from "lucide"
  import { registerIcons } from "@tecton/wc/icon/registry.js"

  registerIcons({ Bold, Italic, Underline })
</script>
