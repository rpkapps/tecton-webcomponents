<style>
  #bubble-collapsible tec-collapsible[open] tec-button svg {
    rotate: 180deg;
  }
</style>
<div id="bubble-collapsible" class="flex w-full max-w-sm flex-col gap-8 py-12">
  <tec-bubble variant="muted"><tec-bubble-content>How can I help you today?</tec-bubble-content></tec-bubble>
  <tec-bubble variant="muted" align="end">
    <tec-bubble-content>
      <tec-collapsible>
        <div class="whitespace-pre-line" data-text></div>
        <tec-collapsible-trigger>
          <tec-button variant="link" style="--tec-button-foreground: var(--tec-muted-foreground); --tec-button-padding-inline: 0">
            <span>Show more</span>
            <tec-icon name="chevron-down" slot="end" aria-hidden="true"></tec-icon>
          </tec-button>
        </tec-collapsible-trigger>
      </tec-collapsible>
    </tec-bubble-content>
  </tec-bubble>
</div>
<script type="module">
  import { ChevronDown } from "lucide"
  import { registerIcons } from "@tecton/wc/icon/registry.js"

  registerIcons({ ChevronDown })

  const root = document.getElementById("bubble-collapsible")
  const text = `The accessibility review found two focus states that were visually too subtle in dark mode.

I checked the dialog, menu, and drawer paths because each one renders focusable controls inside a layered surface.

The dialog and drawer are fine. The menu needs the hover and focus tokens split so keyboard focus stays visible when the pointer is not involved.

I also recommend keeping the change in the style file instead of the primitive so the other themes can choose their own focus treatment later.`
  const preview = `${text.slice(0, 180)}...`
  const collapsible = root.querySelector("tec-collapsible")
  const render = (open) => {
    root.querySelector("[data-text]").textContent = open ? text : preview
    collapsible.querySelector("tec-button span").textContent = open ? "Show less" : "Show more"
  }
  collapsible.addEventListener("tec-open-change", (event) => render(event.detail.open))
  render(false)
</script>
