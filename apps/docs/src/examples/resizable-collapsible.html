<div id="resizable-collapsible" class="flex w-full max-w-md flex-col gap-3">
  <tec-resizable-group class="h-[220px] rounded-lg border border-border">
    <tec-resizable-panel default-size="30%" min-size="120px" max-size="60%" collapsible>
      <div class="flex h-full flex-col gap-1 p-4 text-sm">
        <span class="font-semibold">Wells</span>
        <span class="text-muted-foreground">34/10-A-12 H</span>
        <span class="text-muted-foreground">34/10-A-14 H</span>
        <span class="text-muted-foreground">34/10-B-3 AH</span>
      </div>
    </tec-resizable-panel>
    <tec-resizable-handle with-handle aria-label="Resize well list"></tec-resizable-handle>
    <tec-resizable-panel min-size="40%">
      <div class="flex h-full items-center justify-center p-6">
        <span class="font-semibold">Log viewer</span>
      </div>
    </tec-resizable-panel>
  </tec-resizable-group>
  <div class="flex items-center gap-2">
    <tec-button variant="outline" size="sm" data-action="toggle">Toggle well list</tec-button>
    <p class="text-sm text-muted-foreground" aria-live="polite">Layout: 30 / 70</p>
  </div>
</div>
<script type="module">
  const root = document.getElementById("resizable-collapsible")
  const group = root.querySelector("tec-resizable-group")
  const panel = root.querySelector("tec-resizable-panel")
  const status = root.querySelector("p")
  const show = (layout) => (status.textContent = `Layout: ${layout.map((size) => Math.round(size)).join(" / ")}`)

  // Fired after a drag, a keyboard step or a double-click: save it to restore with group.layout.
  group.addEventListener("tec-layout-change", (event) => show(event.detail.layout))
  root.querySelector("[data-action=toggle]").addEventListener("click", () => {
    if (panel.collapsed) panel.expand()
    else panel.collapse()
    show(group.layout)
  })
</script>
