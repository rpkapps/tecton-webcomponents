<tec-button-group>
  <tec-button variant="outline"><svg slot="start" xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 8V4H8"/><rect width="16" height="12" x="4" y="8" rx="2"/><path d="M2 14h2"/><path d="M20 14h2"/><path d="M15 13v2"/><path d="M9 13v2"/></svg>Copilot</tec-button>
  <tec-popover align="end" class="text-sm">
    <tec-button slot="trigger" variant="outline" size="icon" aria-label="Open Popover"><svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m6 9 6 6 6-6"/></svg></tec-button>
    <tec-popover-header>
      <tec-popover-title>Start a new task with Copilot</tec-popover-title>
      <tec-popover-description>Describe your task in natural language.</tec-popover-description>
    </tec-popover-header>
    <tec-field>
      <tec-field-label for="button-group-popover-task" class="sr-only">Task Description</tec-field-label>
      <tec-textarea id="button-group-popover-task" placeholder="I need to..." class="resize-none"></tec-textarea>
      <tec-field-description>Copilot will open a pull request for review.</tec-field-description>
    </tec-field>
  </tec-popover>
</tec-button-group>
