<tec-button-group>
  <tec-button variant="outline"><tec-icon name="bot" slot="start" aria-hidden="true"></tec-icon>Copilot</tec-button>
  <tec-popover align="end" class="text-sm">
    <tec-button slot="trigger" variant="outline" size="icon" aria-label="Open Popover"><tec-icon name="chevron-down" aria-hidden="true"></tec-icon></tec-button>
    <tec-popover-header>
      <tec-popover-title>Start a new task with Copilot</tec-popover-title>
      <tec-popover-description>Describe your task in natural language.</tec-popover-description>
    </tec-popover-header>
    <tec-field>
      <tec-field-label for="button-group-popover-task" class="sr-only">Task Description</tec-field-label>
      <tec-textarea id="button-group-popover-task" placeholder="I need to..." class="resize-none"></tec-textarea>
      <tec-field-description>Copilot will open a pull request for review.</tec-field-description>
    </tec-field>
  </tec-popover>
</tec-button-group>
<script type="module">
  import { Bot, ChevronDown } from "lucide"
  import { registerIcons } from "@tecton/wc/icon/registry.js"

  registerIcons({ Bot, ChevronDown })
</script>
