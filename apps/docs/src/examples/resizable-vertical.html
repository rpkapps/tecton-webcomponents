<tec-resizable-group orientation="vertical" class="min-h-[200px] max-w-sm rounded-lg border border-border">
  <tec-resizable-panel default-size="25%">
    <div class="flex h-full items-center justify-center p-6">
      <span class="font-semibold">Header</span>
    </div>
  </tec-resizable-panel>
  <tec-resizable-handle aria-label="Resize header"></tec-resizable-handle>
  <tec-resizable-panel default-size="75%">
    <div class="flex h-full items-center justify-center p-6">
      <span class="font-semibold">Content</span>
    </div>
  </tec-resizable-panel>
</tec-resizable-group>
