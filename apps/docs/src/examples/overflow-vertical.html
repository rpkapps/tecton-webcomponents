<div id="overflow-vertical" class="flex flex-col gap-2">
  <!-- Drag the bottom edge: a vertical row measures heights; the More menu sits at the bottom and opens to the side. -->
  <div class="h-80 min-h-32 w-fit resize-y overflow-hidden rounded-md border border-border p-1">
    <tec-toolbar aria-label="Tools" orientation="vertical" labels="never" class="h-full">
      <!-- One tool at a time: each becomes a radio item in the menu. -->
      <tec-overflow-item value="select" label="Select" priority="3" menu-type="radio">
        <tec-toggle aria-label="Select" pressed><tec-icon name="mouse-pointer2" aria-hidden="true"></tec-icon></tec-toggle>
      </tec-overflow-item>
      <tec-overflow-item value="pan" label="Pan" priority="2" menu-type="radio">
        <tec-toggle aria-label="Pan"><tec-icon name="hand" aria-hidden="true"></tec-icon></tec-toggle>
      </tec-overflow-item>
      <tec-overflow-item value="draw" label="Draw" priority="1" menu-type="radio">
        <tec-toggle aria-label="Draw"><tec-icon name="pencil" aria-hidden="true"></tec-icon></tec-toggle>
      </tec-overflow-item>
      <tec-overflow-item value="shape" label="Shape" menu-type="radio">
        <tec-toggle aria-label="Shape"><tec-icon name="shapes" aria-hidden="true"></tec-icon></tec-toggle>
      </tec-overflow-item>
      <tec-overflow-item value="text" label="Text" menu-type="radio">
        <tec-toggle aria-label="Text"><tec-icon name="type" aria-hidden="true"></tec-icon></tec-toggle>
      </tec-overflow-item>
      <tec-overflow-item value="measure" label="Measure" menu-type="radio">
        <tec-toggle aria-label="Measure"><tec-icon name="ruler" aria-hidden="true"></tec-icon></tec-toggle>
      </tec-overflow-item>
      <tec-overflow-divider></tec-overflow-divider>
      <tec-overflow-spacer></tec-overflow-spacer>
      <!-- Not wrapped: the zoom buttons never leave the rail. -->
      <tec-button variant="ghost" size="icon" aria-label="Zoom in"><tec-icon name="zoom-in" aria-hidden="true"></tec-icon></tec-button>
      <tec-button variant="ghost" size="icon" aria-label="Zoom out"><tec-icon name="zoom-out" aria-hidden="true"></tec-icon></tec-button>
    </tec-toolbar>
  </div>
  <p class="text-xs text-muted-foreground">Drag the bottom edge to resize. Tool: <span data-tool>select</span></p>
</div>
<script type="module">
  import { Hand, MousePointer2, Pencil, Ruler, Shapes, Type, ZoomIn, ZoomOut } from "lucide"
  import { registerIcons } from "@tecton/wc/icon/registry.js"

  registerIcons({ Hand, MousePointer2, Pencil, Ruler, Shapes, Type, ZoomIn, ZoomOut })

  const root = document.getElementById("overflow-vertical")
  const toggles = [...root.querySelectorAll("tec-toggle")]

  // The tools are exclusive: pressing one releases the others (in the row and from the menu alike).
  root.addEventListener("click", (event) => {
    const pressed = event.target.closest?.("tec-toggle")
    if (!pressed) return
    for (const toggle of toggles) toggle.pressed = toggle === pressed
    root.querySelector("[data-tool]").textContent = pressed.closest("tec-overflow-item").value
  })
</script>
