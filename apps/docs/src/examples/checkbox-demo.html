<tec-field-group class="w-full max-w-sm">
  <tec-field orientation="horizontal">
    <tec-checkbox name="terms"></tec-checkbox>
    <tec-field-label>Accept terms and conditions</tec-field-label>
  </tec-field>
  <tec-field orientation="horizontal">
    <tec-checkbox name="terms-2" checked></tec-checkbox>
    <tec-field-content>
      <tec-field-label>Accept terms and conditions</tec-field-label>
      <tec-field-description>By clicking this checkbox, you agree to the terms.</tec-field-description>
    </tec-field-content>
  </tec-field>
  <tec-field orientation="horizontal" disabled>
    <tec-checkbox name="notifications" disabled></tec-checkbox>
    <tec-field-label>Enable notifications</tec-field-label>
  </tec-field>
  <tec-field-label>
    <tec-field orientation="horizontal">
      <tec-checkbox name="notifications-2"></tec-checkbox>
      <tec-field-content>
        <tec-field-title>Enable notifications</tec-field-title>
        <tec-field-description>You can enable or disable notifications at any time.</tec-field-description>
      </tec-field-content>
    </tec-field>
  </tec-field-label>
</tec-field-group>
