<div class="grid w-full max-w-sm gap-4">
  <tec-input-group>
    <tec-input-group-input placeholder="Searching..." aria-label="Search"></tec-input-group-input>
    <tec-input-group-addon align="inline-end">
      <tec-spinner></tec-spinner>
    </tec-input-group-addon>
  </tec-input-group>
  <tec-input-group>
    <tec-input-group-input placeholder="Processing..." aria-label="Command"></tec-input-group-input>
    <tec-input-group-addon>
      <tec-spinner></tec-spinner>
    </tec-input-group-addon>
  </tec-input-group>
  <tec-input-group>
    <tec-input-group-input placeholder="Saving changes..." aria-label="Title"></tec-input-group-input>
    <tec-input-group-addon align="inline-end">
      <tec-input-group-text>Saving...</tec-input-group-text>
      <tec-spinner></tec-spinner>
    </tec-input-group-addon>
  </tec-input-group>
  <tec-input-group>
    <tec-input-group-input placeholder="Refreshing data..." aria-label="Query"></tec-input-group-input>
    <tec-input-group-addon>
      <svg class="animate-spin" xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 2v4" /><path d="m16.2 7.8 2.9-2.9" /><path d="M18 12h4" /><path d="m16.2 16.2 2.9 2.9" /><path d="M12 18v4" /><path d="m4.9 19.1 2.9-2.9" /><path d="M2 12h4" /><path d="m4.9 4.9 2.9 2.9" /></svg>
    </tec-input-group-addon>
    <tec-input-group-addon align="inline-end">
      <tec-input-group-text>Please wait...</tec-input-group-text>
    </tec-input-group-addon>
  </tec-input-group>
</div>
