<tec-button-group aria-label="إجراءات الرسالة" lang="ar">
  <tec-button-group class="hidden sm:flex">
    <tec-button variant="outline" size="icon" aria-label="رجوع"><tec-icon name="arrow-left" class="rtl:rotate-180" aria-hidden="true"></tec-icon></tec-button>
  </tec-button-group>
  <tec-button-group>
    <tec-button variant="outline">أرشفة</tec-button>
    <tec-button variant="outline">تقرير</tec-button>
  </tec-button-group>
  <tec-button-group>
    <tec-button variant="outline">تأجيل</tec-button>
    <tec-dropdown-menu style="--tec-dropdown-menu-width: 10rem">
      <tec-button slot="trigger" variant="outline" size="icon" aria-label="المزيد من الخيارات"><tec-icon name="ellipsis" aria-hidden="true"></tec-icon></tec-button>
      <tec-dropdown-menu-group>
        <tec-dropdown-menu-item><tec-icon name="mail-check" slot="start" aria-hidden="true" style="width:16px;height:16px"></tec-icon>وضع علامة كمقروء</tec-dropdown-menu-item>
        <tec-dropdown-menu-item><tec-icon name="archive" slot="start" aria-hidden="true" style="width:16px;height:16px"></tec-icon>أرشفة</tec-dropdown-menu-item>
      </tec-dropdown-menu-group>
      <tec-dropdown-menu-separator></tec-dropdown-menu-separator>
      <tec-dropdown-menu-group>
        <tec-dropdown-menu-item><tec-icon name="clock" slot="start" aria-hidden="true" style="width:16px;height:16px"></tec-icon>تأجيل</tec-dropdown-menu-item>
        <tec-dropdown-menu-item><tec-icon name="calendar-plus" slot="start" aria-hidden="true" style="width:16px;height:16px"></tec-icon>إضافة إلى التقويم</tec-dropdown-menu-item>
        <tec-dropdown-menu-item><tec-icon name="list-filter" slot="start" aria-hidden="true" style="width:16px;height:16px"></tec-icon>إضافة إلى القائمة</tec-dropdown-menu-item>
        <tec-dropdown-menu-sub>
          <tec-dropdown-menu-sub-trigger><tec-icon name="tag" slot="start" aria-hidden="true" style="width:16px;height:16px"></tec-icon>تصنيف كـ...</tec-dropdown-menu-sub-trigger>
          <tec-dropdown-menu-sub-content>
            <tec-dropdown-menu-group selection-mode="single">
              <tec-dropdown-menu-item value="personal" checked>شخصي</tec-dropdown-menu-item>
              <tec-dropdown-menu-item value="work">عمل</tec-dropdown-menu-item>
              <tec-dropdown-menu-item value="other">آخر</tec-dropdown-menu-item>
            </tec-dropdown-menu-group>
          </tec-dropdown-menu-sub-content>
        </tec-dropdown-menu-sub>
      </tec-dropdown-menu-group>
      <tec-dropdown-menu-separator></tec-dropdown-menu-separator>
      <tec-dropdown-menu-group>
        <tec-dropdown-menu-item variant="destructive"><tec-icon name="trash" slot="start" aria-hidden="true" style="width:16px;height:16px"></tec-icon>سلة المهملات</tec-dropdown-menu-item>
      </tec-dropdown-menu-group>
    </tec-dropdown-menu>
  </tec-button-group>
</tec-button-group>
<script type="module">
  import { Archive, ArrowLeft, CalendarPlus, Clock, Ellipsis, ListFilter, MailCheck, Tag, Trash } from "lucide"
  import { registerIcons } from "@tecton/wc/icon/registry.js"

  registerIcons({ Archive, ArrowLeft, CalendarPlus, Clock, Ellipsis, ListFilter, MailCheck, Tag, Trash })
</script>
