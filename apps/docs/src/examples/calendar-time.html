<tec-card id="calendar-time" size="sm" class="mx-auto w-fit">
  <tec-card-content>
    <tec-calendar class="[--tec-calendar-padding:0]"></tec-calendar>
  </tec-card-content>
  <tec-card-footer class="border-t border-border bg-card">
    <tec-field-group>
      <tec-field>
        <tec-field-label for="calendar-time-from">Start Time</tec-field-label>
        <tec-time-field id="calendar-time-from" granularity="second" value="10:30:00" class="w-full">
          <tec-icon name="clock2" slot="start" aria-hidden="true" style="width:16px;height:16px"></tec-icon>
        </tec-time-field>
      </tec-field>
      <tec-field>
        <tec-field-label for="calendar-time-to">End Time</tec-field-label>
        <tec-time-field id="calendar-time-to" granularity="second" value="12:30:00" class="w-full">
          <tec-icon name="clock2" slot="start" aria-hidden="true" style="width:16px;height:16px"></tec-icon>
        </tec-time-field>
      </tec-field>
    </tec-field-group>
  </tec-card-footer>
</tec-card>
<script type="module">
  import { Clock2 } from "lucide"
  import { registerIcons } from "@tecton/wc/icon/registry.js"

  registerIcons({ Clock2 })

  const now = new Date()
  document.querySelector("#calendar-time tec-calendar").value = `${now.getFullYear()}-${String(now.getMonth() + 1).padStart(2, "0")}-12`
</script>
