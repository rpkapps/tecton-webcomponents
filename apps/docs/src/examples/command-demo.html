<tec-command class="max-w-sm" style="--tec-command-border-width: 1px">
  <tec-command-input placeholder="Type a command or search..."></tec-command-input>
  <tec-command-list>
    <tec-command-group heading="Suggestions">
      <tec-command-item><tec-icon name="calendar" aria-hidden="true" style="width:16px;height:16px"></tec-icon><span>Calendar</span></tec-command-item>
      <tec-command-item><tec-icon name="face-slightly-smiling" aria-hidden="true" style="width:16px;height:16px"></tec-icon><span>Search Emoji</span></tec-command-item>
      <tec-command-item disabled><tec-icon name="calculator" aria-hidden="true" style="width:16px;height:16px"></tec-icon><span>Calculator</span></tec-command-item>
    </tec-command-group>
    <tec-command-separator></tec-command-separator>
    <tec-command-group heading="Settings">
      <tec-command-item><tec-icon name="user" aria-hidden="true" style="width:16px;height:16px"></tec-icon><span>Profile</span><tec-command-shortcut>⌘P</tec-command-shortcut></tec-command-item>
      <tec-command-item><tec-icon name="credit-card" aria-hidden="true" style="width:16px;height:16px"></tec-icon><span>Billing</span><tec-command-shortcut>⌘B</tec-command-shortcut></tec-command-item>
      <tec-command-item><tec-icon name="settings" aria-hidden="true" style="width:16px;height:16px"></tec-icon><span>Settings</span><tec-command-shortcut>⌘S</tec-command-shortcut></tec-command-item>
    </tec-command-group>
    <tec-command-empty>No results found.</tec-command-empty>
  </tec-command-list>
</tec-command>
<script type="module">
  import { Calculator, Calendar, CreditCard, FaceSlightlySmiling, Settings, User } from "lucide"
  import { registerIcons } from "@tecton/wc/icon/registry.js"

  registerIcons({ Calculator, Calendar, CreditCard, FaceSlightlySmiling, Settings, User })
</script>
