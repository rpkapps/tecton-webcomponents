<div id="slider-format" class="mx-auto grid w-full max-w-xs gap-3">
  <div class="flex items-center justify-between gap-2">
    <tec-label for="slider-format-opacity">Opacity</tec-label>
    <span class="text-sm text-muted-foreground">60%</span>
  </div>
  <tec-slider id="slider-format-opacity" value="0.6" min="0" max="1" step="0.05"></tec-slider>
</div>
<script type="module">
  const root = document.getElementById("slider-format")
  const slider = root.querySelector("tec-slider")
  const output = root.querySelector("span")
  const format = { style: "percent" }

  // aria-valuetext uses the same format, so screen readers hear "60%" rather than "0.6".
  slider.formatOptions = format
  slider.addEventListener("input", () => {
    output.textContent = new Intl.NumberFormat(undefined, format).format(slider.values[0])
  })
</script>
