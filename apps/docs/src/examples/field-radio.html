<tec-field-set class="w-full max-w-xs">
  <tec-field-legend variant="label">Subscription Plan</tec-field-legend>
  <tec-field-description>Yearly and lifetime plans offer significant savings.</tec-field-description>
  <tec-radio-group name="plan" value="monthly" aria-label="Subscription Plan">
    <tec-field orientation="horizontal">
      <tec-radio-group-item value="monthly"></tec-radio-group-item>
      <tec-field-label class="font-normal">Monthly ($9.99/month)</tec-field-label>
    </tec-field>
    <tec-field orientation="horizontal">
      <tec-radio-group-item value="yearly"></tec-radio-group-item>
      <tec-field-label class="font-normal">Yearly ($99.99/year)</tec-field-label>
    </tec-field>
    <tec-field orientation="horizontal">
      <tec-radio-group-item value="lifetime"></tec-radio-group-item>
      <tec-field-label class="font-normal">Lifetime ($299.99)</tec-field-label>
    </tec-field>
  </tec-radio-group>
</tec-field-set>
