<tec-field-set class="w-full max-w-xs">
  <tec-field-group>
    <tec-field>
      <tec-field-label>Username</tec-field-label>
      <tec-input type="text" placeholder="Max Leiter"></tec-input>
      <tec-field-description>Choose a unique username for your account.</tec-field-description>
    </tec-field>
    <tec-field>
      <tec-field-label>Password</tec-field-label>
      <tec-field-description>Must be at least 8 characters long.</tec-field-description>
      <tec-input type="password" placeholder="••••••••" minlength="8"></tec-input>
    </tec-field>
  </tec-field-group>
</tec-field-set>
