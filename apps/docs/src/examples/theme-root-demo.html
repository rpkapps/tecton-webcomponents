<tec-theme-root id="theme-root-demo" class="block rounded-lg border border-border p-6" style="--tec-primary: var(--tecton-palette-green-560); --tec-primary-hover: var(--tecton-palette-green-660); --tec-ring: var(--tecton-palette-green-560)">
  <div class="flex flex-col items-start gap-4 text-sm">
    <p class="text-muted-foreground">Everything inside this root uses its own <code>--tec-primary</code>.</p>
    <tec-popover side="bottom" align="start" label="Inside the top layer">
      <tec-button slot="trigger">Open popover</tec-button>
      <tec-popover-header>
        <tec-popover-title>Inside the top layer</tec-popover-title>
        <tec-popover-description>This panel is shown in the browser's top layer, yet it inherits the root's variables: no portal container is involved.</tec-popover-description>
      </tec-popover-header>
      <tec-button size="sm">Primary action</tec-button>
    </tec-popover>
  </div>
</tec-theme-root>
