<tec-field id="field-errors" class="w-full max-w-xs" invalid>

  <tec-input type="password" value="well"></tec-input>
  <tec-field-error></tec-field-error>
</tec-field>

    { message: "Include a number." },
    { message: "Use at least 8 characters." },
  ]
</script>
