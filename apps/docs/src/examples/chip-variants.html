<div class="flex flex-col items-center gap-3">
  <tec-chip-group aria-label="Solid chips" selection-mode="multiple">
    <tec-chip variant="secondary">secondary</tec-chip>
    <tec-chip variant="default">default</tec-chip>
    <tec-chip variant="info">info</tec-chip>
    <tec-chip variant="success">success</tec-chip>
    <tec-chip variant="warning">warning</tec-chip>
    <tec-chip variant="destructive">destructive</tec-chip>
  </tec-chip-group>
  <tec-chip-group aria-label="Outline chips" selection-mode="multiple">
    <tec-chip variant="secondary" appearance="outline">secondary</tec-chip>
    <tec-chip variant="default" appearance="outline">default</tec-chip>
    <tec-chip variant="info" appearance="outline">info</tec-chip>
    <tec-chip variant="success" appearance="outline">success</tec-chip>
    <tec-chip variant="warning" appearance="outline">warning</tec-chip>
    <tec-chip variant="destructive" appearance="outline">destructive</tec-chip>
  </tec-chip-group>
</div>
