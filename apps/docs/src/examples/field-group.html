<tec-field-group class="w-full max-w-xs">
  <tec-field-set class="gap-3">
    <tec-field-legend variant="label">Responses</tec-field-legend>
    <tec-field-description>
      Get notified when ChatGPT responds to requests that take time, like research or image generation.
    </tec-field-description>
    <tec-field-group class="gap-3">
      <tec-field orientation="horizontal">
        <tec-checkbox checked disabled></tec-checkbox>
        <tec-field-label class="font-normal">Push notifications</tec-field-label>
      </tec-field>
    </tec-field-group>
  </tec-field-set>
  <tec-field-separator></tec-field-separator>
  <tec-field-set class="gap-3">
    <tec-field-legend variant="label">Tasks</tec-field-legend>
    <tec-field-description>
      Get notified when tasks you've created have updates. <a href="#">Manage tasks</a>
    </tec-field-description>
    <tec-field-group class="gap-3">
      <tec-field orientation="horizontal">
        <tec-checkbox></tec-checkbox>
        <tec-field-label class="font-normal">Push notifications</tec-field-label>
      </tec-field>
      <tec-field orientation="horizontal">
        <tec-checkbox></tec-checkbox>
        <tec-field-label class="font-normal">Email notifications</tec-field-label>
      </tec-field>
    </tec-field-group>
  </tec-field-set>
</tec-field-group>
