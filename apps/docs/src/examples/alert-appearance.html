<div class="grid w-full gap-3 md:grid-cols-2">
  <div class="flex flex-col gap-3">
    <tec-alert variant="success" appearance="outline">
      <svg slot="icon" xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="10"/><path d="m16 9-5.5 5.5L8 12"/></svg>
      <tec-alert-title>Model saved</tec-alert-title>
      <tec-alert-description>appearance="outline"</tec-alert-description>
    </tec-alert>
    <tec-alert variant="warning" appearance="outline">
      <svg slot="icon" xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m21.73 18-8-14a2 2 0 0 0-3.48 0l-8 14A2 2 0 0 0 4 21h16a2 2 0 0 0 1.73-3"/><path d="M12 9v4"/><path d="M12 17h.01"/></svg>
      <tec-alert-title>Unsaved changes</tec-alert-title>
      <tec-alert-description>appearance="outline"</tec-alert-description>
    </tec-alert>
    <tec-alert variant="info" appearance="outline">
      <svg slot="icon" xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="10"/><path d="M12 16v-4"/><path d="M12 8h.01"/></svg>
      <tec-alert-title>Model out of date</tec-alert-title>
      <tec-alert-description>appearance="outline"</tec-alert-description>
    </tec-alert>
    <tec-alert variant="destructive" appearance="outline">
      <svg slot="icon" xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="10"/><line x1="12" x2="12" y1="8" y2="12"/><line x1="12" x2="12.01" y1="16" y2="16"/></svg>
      <tec-alert-title>Simulation failed</tec-alert-title>
      <tec-alert-description>appearance="outline"</tec-alert-description>
    </tec-alert>
  </div>
  <div class="flex flex-col gap-3">
    <tec-alert variant="success" appearance="filled">
      <svg slot="icon" xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="10"/><path d="m16 9-5.5 5.5L8 12"/></svg>
      <tec-alert-title>Model saved</tec-alert-title>
      <tec-alert-description>appearance="filled"</tec-alert-description>
    </tec-alert>
    <tec-alert variant="warning" appearance="filled">
      <svg slot="icon" xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m21.73 18-8-14a2 2 0 0 0-3.48 0l-8 14A2 2 0 0 0 4 21h16a2 2 0 0 0 1.73-3"/><path d="M12 9v4"/><path d="M12 17h.01"/></svg>
      <tec-alert-title>Unsaved changes</tec-alert-title>
      <tec-alert-description>appearance="filled"</tec-alert-description>
    </tec-alert>
    <tec-alert variant="info" appearance="filled">
      <svg slot="icon" xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="10"/><path d="M12 16v-4"/><path d="M12 8h.01"/></svg>
      <tec-alert-title>Model out of date</tec-alert-title>
      <tec-alert-description>appearance="filled"</tec-alert-description>
    </tec-alert>
    <tec-alert variant="destructive" appearance="filled">
      <svg slot="icon" xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="10"/><line x1="12" x2="12" y1="8" y2="12"/><line x1="12" x2="12.01" y1="16" y2="16"/></svg>
      <tec-alert-title>Simulation failed</tec-alert-title>
      <tec-alert-description>appearance="filled"</tec-alert-description>
    </tec-alert>
  </div>
</div>
