<div id="command-scrollable" class="flex flex-col gap-4">
  <tec-button variant="outline" class="w-fit">Open Menu</tec-button>
  <tec-command-dialog>
    <tec-command>
      <tec-command-input placeholder="Type a command or search..."></tec-command-input>
      <tec-command-list>
        <tec-command-group heading="Navigation">
          <tec-command-item><tec-icon name="home" aria-hidden="true" style="width:16px;height:16px"></tec-icon><span>Home</span><tec-command-shortcut>⌘H</tec-command-shortcut></tec-command-item>
          <tec-command-item><tec-icon name="inbox" aria-hidden="true" style="width:16px;height:16px"></tec-icon><span>Inbox</span><tec-command-shortcut>⌘I</tec-command-shortcut></tec-command-item>
          <tec-command-item><tec-icon name="file-text" aria-hidden="true" style="width:16px;height:16px"></tec-icon><span>Documents</span><tec-command-shortcut>⌘D</tec-command-shortcut></tec-command-item>
          <tec-command-item><tec-icon name="folder" aria-hidden="true" style="width:16px;height:16px"></tec-icon><span>Folders</span><tec-command-shortcut>⌘F</tec-command-shortcut></tec-command-item>
        </tec-command-group>
        <tec-command-separator></tec-command-separator>
        <tec-command-group heading="Actions">
          <tec-command-item><tec-icon name="plus" aria-hidden="true" style="width:16px;height:16px"></tec-icon><span>New File</span><tec-command-shortcut>⌘N</tec-command-shortcut></tec-command-item>
          <tec-command-item><tec-icon name="folder-plus" aria-hidden="true" style="width:16px;height:16px"></tec-icon><span>New Folder</span><tec-command-shortcut>⇧⌘N</tec-command-shortcut></tec-command-item>
          <tec-command-item><tec-icon name="copy" aria-hidden="true" style="width:16px;height:16px"></tec-icon><span>Copy</span><tec-command-shortcut>⌘C</tec-command-shortcut></tec-command-item>
          <tec-command-item><tec-icon name="scissors" aria-hidden="true" style="width:16px;height:16px"></tec-icon><span>Cut</span><tec-command-shortcut>⌘X</tec-command-shortcut></tec-command-item>
          <tec-command-item><tec-icon name="clipboard-paste" aria-hidden="true" style="width:16px;height:16px"></tec-icon><span>Paste</span><tec-command-shortcut>⌘V</tec-command-shortcut></tec-command-item>
          <tec-command-item><tec-icon name="trash" aria-hidden="true" style="width:16px;height:16px"></tec-icon><span>Delete</span><tec-command-shortcut>⌫</tec-command-shortcut></tec-command-item>
        </tec-command-group>
        <tec-command-separator></tec-command-separator>
        <tec-command-group heading="View">
          <tec-command-item><tec-icon name="layout-grid" aria-hidden="true" style="width:16px;height:16px"></tec-icon><span>Grid View</span></tec-command-item>
          <tec-command-item><tec-icon name="list" aria-hidden="true" style="width:16px;height:16px"></tec-icon><span>List View</span></tec-command-item>
          <tec-command-item><tec-icon name="zoom-in" aria-hidden="true" style="width:16px;height:16px"></tec-icon><span>Zoom In</span><tec-command-shortcut>⌘+</tec-command-shortcut></tec-command-item>
          <tec-command-item><tec-icon name="zoom-out" aria-hidden="true" style="width:16px;height:16px"></tec-icon><span>Zoom Out</span><tec-command-shortcut>⌘-</tec-command-shortcut></tec-command-item>
        </tec-command-group>
        <tec-command-separator></tec-command-separator>
        <tec-command-group heading="Account">
          <tec-command-item><tec-icon name="user" aria-hidden="true" style="width:16px;height:16px"></tec-icon><span>Profile</span><tec-command-shortcut>⌘P</tec-command-shortcut></tec-command-item>
          <tec-command-item><tec-icon name="credit-card" aria-hidden="true" style="width:16px;height:16px"></tec-icon><span>Billing</span><tec-command-shortcut>⌘B</tec-command-shortcut></tec-command-item>
          <tec-command-item><tec-icon name="settings" aria-hidden="true" style="width:16px;height:16px"></tec-icon><span>Settings</span><tec-command-shortcut>⌘S</tec-command-shortcut></tec-command-item>
          <tec-command-item><tec-icon name="bell" aria-hidden="true" style="width:16px;height:16px"></tec-icon><span>Notifications</span></tec-command-item>
          <tec-command-item><tec-icon name="circle-help" aria-hidden="true" style="width:16px;height:16px"></tec-icon><span>Help &amp; Support</span></tec-command-item>
        </tec-command-group>
        <tec-command-separator></tec-command-separator>
        <tec-command-group heading="Tools">
          <tec-command-item><tec-icon name="calculator" aria-hidden="true" style="width:16px;height:16px"></tec-icon><span>Calculator</span></tec-command-item>
          <tec-command-item><tec-icon name="calendar" aria-hidden="true" style="width:16px;height:16px"></tec-icon><span>Calendar</span></tec-command-item>
          <tec-command-item><tec-icon name="image" aria-hidden="true" style="width:16px;height:16px"></tec-icon><span>Image Editor</span></tec-command-item>
          <tec-command-item><tec-icon name="code" aria-hidden="true" style="width:16px;height:16px"></tec-icon><span>Code Editor</span></tec-command-item>
        </tec-command-group>
        <tec-command-empty>No results found.</tec-command-empty>
      </tec-command-list>
    </tec-command>
  </tec-command-dialog>
</div>
<script type="module">
  import { Bell, Calculator, Calendar, CircleHelp, ClipboardPaste, Code, Copy, CreditCard, FileText, Folder, FolderPlus, Home, Image, Inbox, LayoutGrid, List, Plus, Scissors, Settings, Trash, User, ZoomIn, ZoomOut } from "lucide"
  import { registerIcons } from "@tecton/wc/icon/registry.js"

  registerIcons({ Bell, Calculator, Calendar, CircleHelp, ClipboardPaste, Code, Copy, CreditCard, FileText, Folder, FolderPlus, Home, Image, Inbox, LayoutGrid, List, Plus, Scissors, Settings, Trash, User, ZoomIn, ZoomOut })

  const root = document.getElementById("command-scrollable")
  const dialog = root.querySelector("tec-command-dialog")
  root.querySelector("tec-button").addEventListener("click", () => dialog.show())
</script>
