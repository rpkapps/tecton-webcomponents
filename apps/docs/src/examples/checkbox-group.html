<tec-field-set class="w-full max-w-xs">
  <tec-field-legend variant="label">Show these items on the desktop:</tec-field-legend>
  <tec-field-description>Select the items you want to show on the desktop.</tec-field-description>
  <tec-field-group class="gap-3">
    <tec-field orientation="horizontal">
      <tec-checkbox name="desktop" value="hard-disks" checked></tec-checkbox>
      <tec-field-label class="font-normal">Hard disks</tec-field-label>
    </tec-field>
    <tec-field orientation="horizontal">
      <tec-checkbox name="desktop" value="external-disks" checked></tec-checkbox>
      <tec-field-label class="font-normal">External disks</tec-field-label>
    </tec-field>
    <tec-field orientation="horizontal">
      <tec-checkbox name="desktop" value="media"></tec-checkbox>
      <tec-field-label class="font-normal">CDs, DVDs, and iPods</tec-field-label>
    </tec-field>
    <tec-field orientation="horizontal">
      <tec-checkbox name="desktop" value="servers"></tec-checkbox>
      <tec-field-label class="font-normal">Connected servers</tec-field-label>
    </tec-field>
  </tec-field-group>
</tec-field-set>
