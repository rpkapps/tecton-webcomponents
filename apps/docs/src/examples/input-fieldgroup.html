<form class="w-full max-w-xs">
  <tec-field-group>
    <tec-field>
      <tec-field-label>Name</tec-field-label>
      <tec-input name="name" placeholder="Jordan Lee"></tec-input>
    </tec-field>
    <tec-field>
      <tec-field-label>Email</tec-field-label>
      <tec-input name="email" type="email" placeholder="name@example.com"></tec-input>
      <tec-field-description>We'll send updates to this address.</tec-field-description>
    </tec-field>
    <tec-field orientation="horizontal">
      <tec-button type="reset" variant="outline">Reset</tec-button>
      <tec-button type="submit">Submit</tec-button>
    </tec-field>
  </tec-field-group>
</form>
