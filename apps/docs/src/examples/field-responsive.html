<form class="w-full max-w-lg">
  <tec-field-set>
    <tec-field-legend>Profile</tec-field-legend>
    <tec-field-description>Fill in your profile information.</tec-field-description>
    <tec-field-group>
      <tec-field orientation="responsive">
        <tec-field-content>
          <tec-field-label>Name</tec-field-label>
          <tec-field-description>Provide your full name for identification</tec-field-description>
        </tec-field-content>
        <tec-input name="name" placeholder="Evil Rabbit" required></tec-input>
      </tec-field>
      <tec-field orientation="responsive">
        <tec-button type="submit">Submit</tec-button>
        <tec-button variant="outline">Cancel</tec-button>
      </tec-field>
    </tec-field-group>
  </tec-field-set>
</form>
