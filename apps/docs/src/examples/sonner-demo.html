<div id="sonner-demo">
  <tec-button variant="outline">Show Toast</tec-button>
  <tec-toaster></tec-toaster>
</div>
<script type="module">
  import { toast } from "@tecton/wc/sonner"

  const root = document.getElementById("sonner-demo")
  root.querySelector("tec-button").addEventListener("click", () =>
    toast("Event has been created", {
      description: "Sunday, December 03, 2023 at 9:00 AM",
      action: { label: "Undo", onClick: () => console.log("Undo") },
    })
  )
</script>
