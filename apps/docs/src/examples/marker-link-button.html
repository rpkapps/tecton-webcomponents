<div id="marker-link-button" class="flex w-full max-w-sm flex-col gap-8 py-12">
  <tec-marker href="#links-and-buttons">
    <tec-marker-icon><svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M15 6a9 9 0 0 0-9 9V3"/><circle cx="18" cy="6" r="3"/><circle cx="6" cy="18" r="3"/></svg></tec-marker-icon>
    <tec-marker-content>View the pull request</tec-marker-content>
  </tec-marker>
  <tec-marker type="button" class="hover:text-foreground">
    <tec-marker-icon><svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 12a9 9 0 1 0 9-9 9.75 9.75 0 0 0-6.74 2.74L3 8"/><path d="M3 3v5h5"/></svg></tec-marker-icon>
    <tec-marker-content>Revert this change</tec-marker-content>
  </tec-marker>
  <p class="text-sm text-muted-foreground" role="status"></p>
</div>
<script type="module">
  const root = document.getElementById("marker-link-button")
  root.querySelector('tec-marker[type="button"]').addEventListener("click", () => {
    root.querySelector("[role=status]").textContent = "Change reverted."
  })
</script>
