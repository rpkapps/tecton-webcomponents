<form id="switch-form" class="flex w-full max-w-sm flex-col gap-4">
  <tec-switch name="telemetry" checked>Send telemetry</tec-switch>
  <tec-switch name="terms" value="accepted" required>Accept the terms of use</tec-switch>
  <div class="flex gap-2">
    <tec-button type="submit">Save</tec-button>
    <tec-button type="reset" variant="outline">Reset</tec-button>
  </div>
  <output class="text-sm text-muted-foreground">Submit to see the form data.</output>
</form>
<script type="module">
  const form = document.getElementById("switch-form")
  form.addEventListener("submit", (event) => {
    event.preventDefault()
    const data = [...new FormData(form)].map(([k, v]) => `${k}=${v}`).join(", ")
    form.querySelector("output").textContent = data || "(nothing submitted)"
  })
</script>
