<div class="flex w-full max-w-sm flex-col" lang="ar">
  <tec-card class="h-80 w-full gap-0">
    <tec-message-scroller>
      <tec-message-scroller-viewport aria-label="الرسائل">
        <tec-message-scroller-content class="p-4">
          <tec-message-scroller-item message-id="r1" scroll-anchor>
            <tec-message align="end"><tec-message-content>
              <tec-bubble variant="muted"><tec-bubble-content>ما الذي تغيّر في سجلات الضغط الليلة الماضية؟</tec-bubble-content></tec-bubble>
            </tec-message-content></tec-message>
          </tec-message-scroller-item>
          <tec-message-scroller-item message-id="r2">
            <tec-message><tec-message-content>
              <tec-bubble variant="ghost"><tec-bubble-content>انخفض ضغط الأنابيب في البئر A-12 بنسبة 6% بين الساعة الثانية والرابعة صباحًا، ثم عاد بعد تغيير الخانق. بقيت الآبار الأخرى ضمن نطاقها الطبيعي، ولم تُسجَّل أي إنذارات إضافية خلال الوردية.</tec-bubble-content></tec-bubble>
            </tec-message-content></tec-message>
          </tec-message-scroller-item>
          <tec-message-scroller-item><tec-marker variant="separator"><tec-marker-content>اليوم</tec-marker-content></tec-marker></tec-message-scroller-item>
          <tec-message-scroller-item message-id="r3" scroll-anchor>
            <tec-message align="end"><tec-message-content>
              <tec-bubble variant="muted"><tec-bubble-content>لخّص الاتجاه لتقرير الوردية من فضلك.</tec-bubble-content></tec-bubble>
            </tec-message-content></tec-message>
          </tec-message-scroller-item>
        </tec-message-scroller-content>
      </tec-message-scroller-viewport>
      <tec-message-scroller-button label="الانتقال إلى الأحدث"></tec-message-scroller-button>
    </tec-message-scroller>
  </tec-card>
</div>
