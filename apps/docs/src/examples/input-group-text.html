<div class="grid w-full max-w-sm gap-6">
  <tec-input-group>
    <tec-input-group-input placeholder="0.00" aria-label="Amount"></tec-input-group-input>
    <tec-input-group-addon>
      <tec-input-group-text>$</tec-input-group-text>
    </tec-input-group-addon>
    <tec-input-group-addon align="inline-end">
      <tec-input-group-text>USD</tec-input-group-text>
    </tec-input-group-addon>
  </tec-input-group>
  <tec-input-group>
    <tec-input-group-input placeholder="example.com" aria-label="Domain"></tec-input-group-input>
    <tec-input-group-addon>
      <tec-input-group-text>https://</tec-input-group-text>
    </tec-input-group-addon>
    <tec-input-group-addon align="inline-end">
      <tec-input-group-text>.com</tec-input-group-text>
    </tec-input-group-addon>
  </tec-input-group>
  <tec-input-group>
    <tec-input-group-input placeholder="Enter your username" aria-label="Username"></tec-input-group-input>
    <tec-input-group-addon align="inline-end">
      <tec-input-group-text>@company.com</tec-input-group-text>
    </tec-input-group-addon>
  </tec-input-group>
  <tec-input-group>
    <tec-input-group-textarea placeholder="Enter your message" aria-label="Message"></tec-input-group-textarea>
    <tec-input-group-addon align="block-end">
      <tec-input-group-text class="text-xs">120 characters left</tec-input-group-text>
    </tec-input-group-addon>
  </tec-input-group>
</div>
