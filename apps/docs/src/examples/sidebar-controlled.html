<div id="sidebar-controlled" class="flex w-full flex-col gap-3">
  <div class="flex items-center gap-2 text-sm">
    <tec-button variant="outline" size="sm" data-action="toggle">Toggle from outside</tec-button>
    <tec-switch data-action="lock">Keep open</tec-switch>
    <span class="ms-auto text-muted-foreground" data-state>State: expanded</span>
  </div>
  <div class="h-[22rem] w-full overflow-hidden rounded-lg border border-border [contain:layout]">
    <tec-sidebar-provider class="h-full min-h-0" persist="none" shortcut="">
      <tec-sidebar collapsible="icon">
        <tec-sidebar-content>
          <tec-sidebar-group>
            <tec-sidebar-menu>
              <tec-sidebar-menu-item>
                <tec-sidebar-menu-button href="#" active tooltip="Overview"><svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect width="7" height="9" x="3" y="3" rx="1"/><rect width="7" height="5" x="14" y="3" rx="1"/><rect width="7" height="9" x="14" y="12" rx="1"/><rect width="7" height="5" x="3" y="16" rx="1"/></svg><span>Overview</span></tec-sidebar-menu-button>
              </tec-sidebar-menu-item>
              <tec-sidebar-menu-item>
                <tec-sidebar-menu-button href="#" tooltip="Wells"><svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M10 18a1 1 0 0 1 1 1v2a1 1 0 0 1-1 1H5a3 3 0 0 1-3-3 1 1 0 0 1 1-1z"/><path d="M13 10H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a1 1 0 0 1 1 1v6a1 1 0 0 1-1 1l-.81 3.242a1 1 0 0 1-.97.758H8"/><path d="M14 4h3a1 1 0 0 1 1 1v2a1 1 0 0 1-1 1h-3"/><path d="M18 6h4"/><path d="m5 10-2 8"/><path d="m7 18 2-8"/></svg><span>Wells</span></tec-sidebar-menu-button>
              </tec-sidebar-menu-item>
            </tec-sidebar-menu>
          </tec-sidebar-group>
        </tec-sidebar-content>
        <tec-sidebar-rail></tec-sidebar-rail>
      </tec-sidebar>
      <tec-sidebar-inset>
        <header class="flex h-12 items-center gap-2 border-b border-border-subtle px-3">
          <tec-sidebar-trigger class="-ms-1"></tec-sidebar-trigger>
        </header>
        <div class="flex-1 p-4"><div class="h-full rounded-lg bg-muted/50"></div></div>
      </tec-sidebar-inset>
    </tec-sidebar-provider>
  </div>
</div>
<script type="module">
  const root = document.getElementById("sidebar-controlled")
  const provider = root.querySelector("tec-sidebar-provider")
  const lock = root.querySelector("[data-action=lock]")
  const label = root.querySelector("[data-state]")
  // Programmatic changes (the property, toggle()) fire no event.
  root.querySelector("[data-action=toggle]").addEventListener("click", () => provider.toggle())
  // User changes (trigger, rail, Ctrl/⌘+B) fire a cancelable tec-open-change.
  provider.addEventListener("tec-open-change", (event) => {
    if (lock.checked && !event.detail.open) event.preventDefault()
  })
  new MutationObserver(() => (label.textContent = `State: ${provider.state}`)).observe(provider, {
    attributes: true,
    attributeFilter: ["collapsed"],
  })
</script>
