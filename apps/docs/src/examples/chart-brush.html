<tec-chart id="chart-brush" class="min-h-[280px] w-full" label="Daily gas production, September">
  <tec-chart-grid></tec-chart-grid>
  <tec-chart-x-axis key="date"></tec-chart-x-axis>
  <tec-chart-y-axis width="36"></tec-chart-y-axis>
  <tec-chart-tooltip></tec-chart-tooltip>
  <tec-chart-area key="gas" curve="monotone" gradient></tec-chart-area>
  <tec-chart-brush start-index="9" end-index="22" preview></tec-chart-brush>
</tec-chart>
<script type="module">
  const chart = document.getElementById("chart-brush")
  const format = new Intl.DateTimeFormat("en", { month: "short", day: "numeric" })
  chart.querySelector("tec-chart-x-axis").tickFormatter = (value) => format.format(new Date(value))
  chart.querySelector("tec-chart-tooltip").labelFormatter = (value) => format.format(new Date(value))
  chart.margin = { top: 12, start: 12, end: 16 }
  chart.config = { gas: { label: "Gas (MMscf)", color: "var(--tec-chart-1)" } }
  const rates = [412, 398, 425, 440, 431, 405, 377, 389, 420, 452, 468, 471, 455, 438, 402, 366, 351, 372, 399, 428, 447, 462, 480, 476, 459, 441, 430, 418, 425, 437]
  chart.data = rates.map((gas, i) => ({ date: `2026-09-${String(i + 1).padStart(2, "0")}`, gas }))
  chart.querySelector("tec-chart-brush").addEventListener("tec-range-change", (event) => {
    console.log(event.detail) // { startIndex, endIndex }
  })
</script>
