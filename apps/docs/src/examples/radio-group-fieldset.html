<tec-field-set class="w-full max-w-xs">
  <tec-field-legend variant="label">Subscription Plan</tec-field-legend>
  <tec-field-description>Yearly and lifetime plans offer significant savings.</tec-field-description>
  <tec-radio-group aria-label="Subscription Plan" value="monthly">
    <tec-field orientation="horizontal">
      <tec-radio-group-item value="monthly" id="radio-group-fieldset-monthly"></tec-radio-group-item>
      <tec-field-label for="radio-group-fieldset-monthly" class="font-normal">Monthly ($9.99/month)</tec-field-label>
    </tec-field>
    <tec-field orientation="horizontal">
      <tec-radio-group-item value="yearly" id="radio-group-fieldset-yearly"></tec-radio-group-item>
      <tec-field-label for="radio-group-fieldset-yearly" class="font-normal">Yearly ($99.99/year)</tec-field-label>
    </tec-field>
    <tec-field orientation="horizontal">
      <tec-radio-group-item value="lifetime" id="radio-group-fieldset-lifetime"></tec-radio-group-item>
      <tec-field-label for="radio-group-fieldset-lifetime" class="font-normal">Lifetime ($299.99)</tec-field-label>
    </tec-field>
  </tec-radio-group>
</tec-field-set>
