<div id="context-menu-events" class="flex w-full flex-col items-center gap-3">
  <tec-context-menu>
    <div slot="trigger" tabindex="0" class="flex aspect-video w-full max-w-xs items-center justify-center rounded-xl border border-dashed text-sm">Right click the well</div>
    <tec-context-menu-item value="open"><tec-icon name="folder-open" aria-hidden="true" slot="start" style="width:16px;height:16px"></tec-icon>Open log</tec-context-menu-item>
    <tec-context-menu-item value="duplicate"><tec-icon name="copy" aria-hidden="true" slot="start" style="width:16px;height:16px"></tec-icon>Duplicate</tec-context-menu-item>
    <tec-context-menu-separator></tec-context-menu-separator>
    <tec-context-menu-item value="delete" variant="destructive"><tec-icon name="trash" aria-hidden="true" slot="start" style="width:16px;height:16px"></tec-icon>Delete</tec-context-menu-item>
  </tec-context-menu>
  <p class="text-sm text-muted-foreground" aria-live="polite">No action yet.</p>
</div>
<script type="module">
  import { Copy, FolderOpen, Trash } from "lucide"
  import { registerIcons } from "@tecton/wc/icon/registry.js"

  registerIcons({ Copy, FolderOpen, Trash })

  const root = document.getElementById("context-menu-events")
  root.addEventListener("tec-select", (event) => {
    root.querySelector("p").textContent = `Action: ${event.detail.value}`
  })
</script>
