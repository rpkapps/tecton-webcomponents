<div class="flex w-full max-w-sm flex-col gap-4 py-12">
  <tec-bubble align="end"><tec-bubble-content>Run the build script.</tec-bubble-content></tec-bubble>
  <tec-bubble variant="destructive">
    <tec-bubble-content>Failed to run the command.</tec-bubble-content>
    <tec-bubble-reactions>
      <tec-popover>
        <tec-button slot="trigger" variant="ghost" size="icon-xs" aria-label="Show error details"><tec-icon name="info" aria-hidden="true"></tec-icon></tec-button>
        <tec-popover-header>
          <tec-popover-title class="text-sm">Command failed with exit code 1</tec-popover-title>
          <tec-popover-description class="text-sm">ENOENT: no such file or directory, open pnpm-lock.yaml</tec-popover-description>
        </tec-popover-header>
      </tec-popover>
    </tec-bubble-reactions>
  </tec-bubble>
</div>
<script type="module">
  import { Info } from "lucide"
  import { registerIcons } from "@tecton/wc/icon/registry.js"

  registerIcons({ Info })
</script>
