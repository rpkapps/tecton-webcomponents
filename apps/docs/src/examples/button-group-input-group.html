<tec-button-group id="button-group-input-group">
  <tec-button-group>
    <tec-button variant="outline" size="icon" aria-label="Add attachment"><tec-icon name="plus" aria-hidden="true"></tec-icon></tec-button>
  </tec-button-group>
  <tec-button-group>
    <tec-input-group>
      <tec-input-group-input placeholder="Send a message..." aria-label="Message"></tec-input-group-input>
      <tec-input-group-addon align="inline-end">
        <tec-tooltip>
          <tec-input-group-button slot="trigger" size="icon-xs" aria-pressed="false" aria-label="Voice Mode"><tec-icon name="audio-lines" aria-hidden="true" style="width:16px;height:16px"></tec-icon></tec-input-group-button>
          Voice Mode
        </tec-tooltip>
      </tec-input-group-addon>
    </tec-input-group>
  </tec-button-group>
</tec-button-group>
<script type="module">
  import { AudioLines, Plus } from "lucide"
  import { registerIcons } from "@tecton/wc/icon/registry.js"

  registerIcons({ AudioLines, Plus })

  const root = document.getElementById("button-group-input-group")
  const voice = root.querySelector("[aria-label='Voice Mode']")
  const input = root.querySelector("tec-input-group-input")
  voice.addEventListener("click", () => {
    const on = voice.getAttribute("aria-pressed") !== "true"
    voice.setAttribute("aria-pressed", String(on))
    voice.variant = on ? "secondary" : "ghost"
    input.disabled = on
    input.placeholder = on ? "Record and send audio..." : "Send a message..."
  })
</script>
