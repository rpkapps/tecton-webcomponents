<tec-field-set class="w-full max-w-sm">
  <tec-field-legend>Address Information</tec-field-legend>
  <tec-field-description>We need your address to deliver your order.</tec-field-description>
  <tec-field-group>
    <tec-field>
      <tec-field-label>Street Address</tec-field-label>
      <tec-input type="text" placeholder="123 Main St"></tec-input>
    </tec-field>
    <div class="grid grid-cols-2 gap-4">
      <tec-field>
        <tec-field-label>City</tec-field-label>
        <tec-input type="text" placeholder="New York"></tec-input>
      </tec-field>
      <tec-field>
        <tec-field-label>Postal Code</tec-field-label>
        <tec-input type="text" placeholder="90502"></tec-input>
      </tec-field>
    </div>
  </tec-field-group>
</tec-field-set>
