<tec-app-shell class="h-72 w-full max-w-3xl overflow-hidden rounded-lg border border-border" lang="ar">
  <tec-app-shell-header>
    <tec-app-shell-brand>
      <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M21 16V8a2 2 0 0 0-1-1.73l-7-4a2 2 0 0 0-2 0l-7 4A2 2 0 0 0 3 8v8a2 2 0 0 0 1 1.73l7 4a2 2 0 0 0 2 0l7-4A2 2 0 0 0 21 16z"/></svg>
      تكتون
    </tec-app-shell-brand>
    <tec-app-shell-nav aria-label="التطبيق">
      <tec-button variant="ghost" size="sm">الآبار</tec-button>
      <tec-button variant="ghost" size="sm">الخرائط</tec-button>
    </tec-app-shell-nav>
    <tec-app-shell-actions>
      <tec-app-shell-command-trigger>ابحث…</tec-app-shell-command-trigger>
      <tec-app-shell-action label="مساعدة" shortcut="?">
        <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="10"/><path d="M9.09 9a3 3 0 0 1 5.83 1c0 2-3 3-3 3"/><path d="M12 17h.01"/></svg>
      </tec-app-shell-action>
      <tec-app-shell-action label="الإعدادات">
        <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M9.671 4.136a2.34 2.34 0 0 1 4.659 0 2.34 2.34 0 0 0 3.319 1.915 2.34 2.34 0 0 1 2.33 4.033 2.34 2.34 0 0 0 0 3.831 2.34 2.34 0 0 1-2.33 4.033 2.34 2.34 0 0 0-3.319 1.915 2.34 2.34 0 0 1-4.659 0 2.34 2.34 0 0 0-3.32-1.915 2.34 2.34 0 0 1-2.33-4.033 2.34 2.34 0 0 0 0-3.831A2.34 2.34 0 0 1 6.35 6.051a2.34 2.34 0 0 0 3.319-1.915"/><circle cx="12" cy="12" r="3"/></svg>
      </tec-app-shell-action>
    </tec-app-shell-actions>
  </tec-app-shell-header>
  <tec-app-shell-body>
    <tec-app-shell-sidebar aria-label="المشروع" class="w-48">
      <div class="p-3 text-sm">الشريط الجانبي</div>
    </tec-app-shell-sidebar>
    <tec-app-shell-split>
      <tec-app-shell-split-panel min-size="40%">
        <tec-app-shell-main>
          <div class="p-4 text-sm text-muted-foreground">منطقة العمل</div>
        </tec-app-shell-main>
      </tec-app-shell-split-panel>
      <tec-app-shell-split-handle></tec-app-shell-split-handle>
      <tec-app-shell-split-panel default-size="200px" min-size="140px" max-size="50%">
        <tec-app-shell-aside aria-label="الخصائص">
          <tec-panel variant="flat" class="h-full" style="--tec-panel-radius: 0">
            <tec-panel-header>
              <tec-panel-title>الخصائص</tec-panel-title>
            </tec-panel-header>
            <tec-panel-content class="text-sm text-muted-foreground">محتوى لوحة الأدوات</tec-panel-content>
          </tec-panel>
        </tec-app-shell-aside>
      </tec-app-shell-split-panel>
    </tec-app-shell-split>
  </tec-app-shell-body>
</tec-app-shell>
