<tec-app-shell class="h-72 w-full max-w-3xl overflow-hidden rounded-lg border border-border" lang="ar">
  <tec-app-shell-header>
    <tec-app-shell-brand>
      {Hexagon}
      تكتون
    </tec-app-shell-brand>
    <tec-app-shell-nav aria-label="التطبيق">
      <tec-button variant="ghost" size="sm">الآبار</tec-button>
      <tec-button variant="ghost" size="sm">الخرائط</tec-button>
    </tec-app-shell-nav>
    <tec-app-shell-actions>
      <tec-app-shell-command-trigger>ابحث…</tec-app-shell-command-trigger>
      <tec-app-shell-action label="مساعدة" shortcut="?">
        {CircleHelp}
      </tec-app-shell-action>
      <tec-app-shell-action label="الإعدادات">
        {Settings}
      </tec-app-shell-action>
    </tec-app-shell-actions>
  </tec-app-shell-header>
  <tec-app-shell-body>
    <tec-app-shell-sidebar aria-label="المشروع" class="w-48">
      <div class="p-3 text-sm">الشريط الجانبي</div>
    </tec-app-shell-sidebar>
    <tec-app-shell-split>
      <tec-app-shell-split-panel min-size="40%">
        <tec-app-shell-main>
          <div class="p-4 text-sm text-muted-foreground">منطقة العمل</div>
        </tec-app-shell-main>
      </tec-app-shell-split-panel>
      <tec-app-shell-split-handle></tec-app-shell-split-handle>
      <tec-app-shell-split-panel default-size="200px" min-size="140px" max-size="50%">
        <tec-app-shell-aside aria-label="الخصائص">
          <div class="p-3 text-sm">الخصائص</div>
        </tec-app-shell-aside>
      </tec-app-shell-split-panel>
    </tec-app-shell-split>
  </tec-app-shell-body>
</tec-app-shell>
