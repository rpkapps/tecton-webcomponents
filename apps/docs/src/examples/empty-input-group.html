<tec-empty>
  <tec-empty-header>
    <tec-empty-title>404 - Not Found</tec-empty-title>
    <tec-empty-description>
      The page you're looking for doesn't exist. Try searching for what you need below.
    </tec-empty-description>
  </tec-empty-header>
  <tec-empty-content>
    <tec-input-group class="sm:w-3/4">
      <tec-input-group-input placeholder="Try searching for pages..." aria-label="Search pages"></tec-input-group-input>
      <tec-input-group-addon>
        <tec-icon name="search" aria-hidden="true" style="width:16px;height:16px"></tec-icon>
      </tec-input-group-addon>
      <tec-input-group-addon align="inline-end">
        <tec-kbd>/</tec-kbd>
      </tec-input-group-addon>
    </tec-input-group>
    <tec-empty-description>Need help? <a href="#">Contact support</a></tec-empty-description>
  </tec-empty-content>
</tec-empty>
<script type="module">
  import { Search } from "lucide"
  import { registerIcons } from "@tecton/wc/icon/registry.js"

  registerIcons({ Search })
</script>
