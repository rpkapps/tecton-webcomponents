<div id="slider-controlled" class="mx-auto grid w-full max-w-xs gap-3">
  <div class="flex items-center justify-between gap-2">
    <tec-label for="slider-controlled-temperature">Temperature</tec-label>
    <span class="text-sm text-muted-foreground">0.3, 0.7</span>
  </div>
  <tec-slider id="slider-controlled-temperature" value="0.3, 0.7" min="0" max="1" step="0.1"></tec-slider>
</div>
<script type="module">
  const root = document.getElementById("slider-controlled")
  const slider = root.querySelector("tec-slider")
  const output = root.querySelector("span")

  // `input` fires continuously while dragging; `change` when the user lets go.
  slider.addEventListener("input", () => {
    output.textContent = slider.values.join(", ")
  })
</script>
