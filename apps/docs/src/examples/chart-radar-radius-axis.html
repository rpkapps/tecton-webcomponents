<tec-chart id="chart-radar-radius-axis" class="mx-auto aspect-square w-full max-w-[300px]" label="Visitors by month and device, radar chart with a value scale">
  <tec-chart-tooltip indicator="line"></tec-chart-tooltip>
  <tec-chart-legend></tec-chart-legend>
  <tec-chart-polar-grid grid-type="circle"></tec-chart-polar-grid>
  <tec-chart-polar-angle-axis key="month"></tec-chart-polar-angle-axis>
  <tec-chart-polar-radius-axis angle="60" axis-line></tec-chart-polar-radius-axis>
  <tec-chart-radar key="desktop" fill-opacity="0.2" stroke-width="2"></tec-chart-radar>
  <tec-chart-radar key="mobile" fill-opacity="0.2" stroke-width="2"></tec-chart-radar>
</tec-chart>
<script type="module">
  const chart = document.getElementById("chart-radar-radius-axis")
  chart.querySelector("tec-chart-polar-angle-axis").tickFormatter = (value) => value.slice(0, 3)
  chart.config = {
    desktop: { label: "Desktop", color: "var(--tec-chart-1)" },
    mobile: { label: "Mobile", color: "var(--tec-chart-2)" },
  }
  chart.data = [
    { month: "January", desktop: 186, mobile: 80 },
    { month: "February", desktop: 305, mobile: 200 },
    { month: "March", desktop: 237, mobile: 120 },
    { month: "April", desktop: 73, mobile: 190 },
    { month: "May", desktop: 209, mobile: 130 },
    { month: "June", desktop: 214, mobile: 140 },
  ]
</script>
