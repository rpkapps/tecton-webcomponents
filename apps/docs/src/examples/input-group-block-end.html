<tec-field-group class="max-w-sm">
  <tec-field>
    <tec-field-label>Input</tec-field-label>
    <tec-input-group>
      <tec-input-group-input placeholder="Enter amount"></tec-input-group-input>
      <tec-input-group-addon align="block-end">
        <tec-input-group-text>USD</tec-input-group-text>
      </tec-input-group-addon>
    </tec-input-group>
    <tec-field-description>Footer positioned below the input.</tec-field-description>
  </tec-field>
  <tec-field>
    <tec-field-label>Textarea</tec-field-label>
    <tec-input-group>
      <tec-input-group-textarea placeholder="Write a comment..."></tec-input-group-textarea>
      <tec-input-group-addon align="block-end">
        <tec-input-group-text>0/280</tec-input-group-text>
        <tec-input-group-button variant="default" size="sm" class="ms-auto">Post</tec-input-group-button>
      </tec-input-group-addon>
    </tec-input-group>
    <tec-field-description>Footer positioned below the textarea.</tec-field-description>
  </tec-field>
</tec-field-group>
