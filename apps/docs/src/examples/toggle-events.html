<div id="toggle-events" class="flex flex-col items-center gap-3">
  <tec-toggle variant="outline" aria-label="Toggle bold">
    <tec-icon name="bold" aria-hidden="true"></tec-icon>
    Bold
  </tec-toggle>
  <p class="text-sm text-muted-foreground" aria-live="polite">Bold is off.</p>
</div>
<script type="module">
  import { Bold } from "lucide"
  import { registerIcons } from "@tecton/wc/icon/registry.js"

  registerIcons({ Bold })

  const root = document.getElementById("toggle-events")
  const status = root.querySelector("p")

  // Fires for pointer, Enter and Space — never for programmatic changes.
  // Call event.preventDefault() to keep the current state.
  root.querySelector("tec-toggle").addEventListener("tec-pressed-change", (event) => {
    status.textContent = `Bold is ${event.detail.pressed ? "on" : "off"}.`
  })
</script>
