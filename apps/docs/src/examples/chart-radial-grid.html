<tec-chart id="chart-radial-grid" class="mx-auto aspect-square w-full max-w-[250px]" label="Visitors by browser, radial bar chart with a grid">
  <tec-chart-tooltip hide-label></tec-chart-tooltip>
  <tec-chart-legend></tec-chart-legend>
  <tec-chart-polar-grid grid-type="circle"></tec-chart-polar-grid>
  <tec-chart-radial-bar key="visitors" name-key="browser" inner-radius="30" outer-radius="100" corner-radius="4"></tec-chart-radial-bar>
</tec-chart>
<script type="module">
  const chart = document.getElementById("chart-radial-grid")
  chart.config = {
    visitors: { label: "Visitors" },
    chrome: { label: "Chrome", color: "var(--tec-chart-1)" },
    safari: { label: "Safari", color: "var(--tec-chart-2)" },
    firefox: { label: "Firefox", color: "var(--tec-chart-3)" },
    edge: { label: "Edge", color: "var(--tec-chart-4)" },
    other: { label: "Other", color: "var(--tec-chart-5)" },
  }
  chart.data = [
    { browser: "chrome", visitors: 275 },
    { browser: "safari", visitors: 200 },
    { browser: "firefox", visitors: 187 },
    { browser: "edge", visitors: 173 },
    { browser: "other", visitors: 90 },
  ]
</script>
