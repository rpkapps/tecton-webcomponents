<tec-alert-dialog size="sm">
  <tec-button slot="trigger" variant="destructive">Delete Chat</tec-button>
  <tec-alert-dialog-header>
    <tec-alert-dialog-media style="--tec-alert-dialog-media-background: color-mix(in oklab, var(--tec-destructive) 10%, transparent); --tec-alert-dialog-media-foreground: var(--tec-destructive)">
      <tec-icon name="trash" aria-hidden="true" style="width:16px;height:16px"></tec-icon>
    </tec-alert-dialog-media>
    <tec-alert-dialog-title>Delete chat?</tec-alert-dialog-title>
    <tec-alert-dialog-description>
      This will permanently delete this chat conversation. View <a href="#">Settings</a> delete any memories saved during this chat.
    </tec-alert-dialog-description>
  </tec-alert-dialog-header>
  <tec-alert-dialog-footer>
    <tec-alert-dialog-cancel>Cancel</tec-alert-dialog-cancel>
    <tec-alert-dialog-action variant="destructive">Delete</tec-alert-dialog-action>
  </tec-alert-dialog-footer>
</tec-alert-dialog>
<script type="module">
  import { Trash } from "lucide"
  import { registerIcons } from "@tecton/wc/icon/registry.js"

  registerIcons({ Trash })
</script>
