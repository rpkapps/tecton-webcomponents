<div id="background-demo" class="flex w-full max-w-3xl flex-col gap-4">
  <div data-tile class="relative isolate flex h-72 flex-col justify-end overflow-hidden rounded-lg border border-border bg-background p-6 [&:fullscreen]:rounded-none [&:fullscreen]:border-0 [&:fullscreen]:p-10">
    <tec-background effect="seismic" tone="azure" intensity="medium"></tec-background>
    <tec-button variant="ghost" size="icon-sm" aria-label="View fullscreen" data-fullscreen class="absolute end-2 top-2">
      <tec-icon name="maximize2" aria-hidden="true"></tec-icon>
    </tec-button>
    <p class="text-xs font-medium tracking-wide text-muted-foreground uppercase">Field development</p>
    <h2 class="mt-1 text-2xl font-medium">Northern Fairway, phase 2</h2>
    <div class="mt-4 grid grid-cols-3 gap-4">
      <tec-stat size="sm">
        <tec-stat-label>Wells</tec-stat-label>
        <tec-stat-value>14</tec-stat-value>
      </tec-stat>
      <tec-stat size="sm">
        <tec-stat-label>Cost per barrel</tec-stat-label>
        <tec-stat-value unit="USD">16.9</tec-stat-value>
        <tec-stat-delta trend="down" tone="positive">-8%</tec-stat-delta>
      </tec-stat>
      <tec-stat size="sm">
        <tec-stat-label>First oil</tec-stat-label>
        <tec-stat-value>2029</tec-stat-value>
      </tec-stat>
    </div>
  </div>
  <div class="flex flex-wrap items-center gap-x-6 gap-y-3 text-sm">
    <tec-toggle-group aria-label="Effect" size="sm" variant="outline" value="seismic" data-option="effect" disallow-empty class="flex-wrap">
      <tec-toggle-group-item value="seismic">seismic</tec-toggle-group-item>
      <tec-toggle-group-item value="contour">contour</tec-toggle-group-item>
      <tec-toggle-group-item value="strata">strata</tec-toggle-group-item>
      <tec-toggle-group-item value="grid">grid</tec-toggle-group-item>
      <tec-toggle-group-item value="flow">flow</tec-toggle-group-item>
      <tec-toggle-group-item value="well-log">well-log</tec-toggle-group-item>
      <tec-toggle-group-item value="drill">drill</tec-toggle-group-item>
      <tec-toggle-group-item value="hexagons">hexagons</tec-toggle-group-item>
      <tec-toggle-group-item value="pressure">pressure</tec-toggle-group-item>
      <tec-toggle-group-item value="horizon">horizon</tec-toggle-group-item>
      <tec-toggle-group-item value="terrain-grid">terrain-grid</tec-toggle-group-item>
    </tec-toggle-group>
    <tec-toggle-group aria-label="Tone" size="sm" variant="outline" value="azure" data-option="tone" disallow-empty>
      <tec-toggle-group-item value="neutral">neutral</tec-toggle-group-item>
      <tec-toggle-group-item value="primary">primary</tec-toggle-group-item>
      <tec-toggle-group-item value="azure">azure</tec-toggle-group-item>
      <tec-toggle-group-item value="saffron">saffron</tec-toggle-group-item>
      <tec-toggle-group-item value="lime">lime</tec-toggle-group-item>
      <tec-toggle-group-item value="blue">blue</tec-toggle-group-item>
    </tec-toggle-group>
    <tec-toggle-group aria-label="Intensity" size="sm" variant="outline" value="medium" data-option="intensity" disallow-empty>
      <tec-toggle-group-item value="low">low</tec-toggle-group-item>
      <tec-toggle-group-item value="medium">medium</tec-toggle-group-item>
      <tec-toggle-group-item value="high">high</tec-toggle-group-item>
    </tec-toggle-group>
  </div>
</div>
<script type="module">
  import { Maximize2 } from "lucide"
  import { registerIcons } from "@tecton/wc/icon/registry.js"

  registerIcons({ Maximize2 })

  const root = document.getElementById("background-demo")
  const tile = root.querySelector("[data-tile]")
  const background = tile.querySelector("tec-background")

  // Each toggle group sets one attribute of the background (effect, tone, intensity).
  root.addEventListener("tec-value-change", (event) => {
    const group = event.target.closest("[data-option]")
    if (group && event.detail.value) background.setAttribute(group.dataset.option, event.detail.value)
  })

  // "View fullscreen" shows the same effect and content full screen; the same button (or Escape) leaves.
  const fullscreen = tile.querySelector("[data-fullscreen]")
  fullscreen.addEventListener("click", () => {
    if (document.fullscreenElement === tile) document.exitFullscreen()
    else tile.requestFullscreen?.()
  })
  document.addEventListener("fullscreenchange", () => {
    fullscreen.setAttribute("aria-label", document.fullscreenElement === tile ? "Exit fullscreen" : "View fullscreen")
  })
</script>
