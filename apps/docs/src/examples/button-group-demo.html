<tec-button-group aria-label="Message actions">
  <tec-button-group class="hidden sm:flex">
    <tec-button variant="outline" size="icon" aria-label="Go Back"><tec-icon name="arrow-left" aria-hidden="true"></tec-icon></tec-button>
  </tec-button-group>
  <tec-button-group>
    <tec-button variant="outline">Archive</tec-button>
    <tec-button variant="outline">Report</tec-button>
  </tec-button-group>
  <tec-button-group>
    <tec-button variant="outline">Snooze</tec-button>
    <tec-dropdown-menu align="end" style="--tec-dropdown-menu-width: 10rem">
      <tec-button slot="trigger" variant="outline" size="icon" aria-label="More Options"><tec-icon name="ellipsis" aria-hidden="true"></tec-icon></tec-button>
      <tec-dropdown-menu-group>
        <tec-dropdown-menu-item><tec-icon name="mail-check" slot="start" aria-hidden="true" style="width:16px;height:16px"></tec-icon>Mark as Read</tec-dropdown-menu-item>
        <tec-dropdown-menu-item><tec-icon name="archive" slot="start" aria-hidden="true" style="width:16px;height:16px"></tec-icon>Archive</tec-dropdown-menu-item>
      </tec-dropdown-menu-group>
      <tec-dropdown-menu-separator></tec-dropdown-menu-separator>
      <tec-dropdown-menu-group>
        <tec-dropdown-menu-item><tec-icon name="clock" slot="start" aria-hidden="true" style="width:16px;height:16px"></tec-icon>Snooze</tec-dropdown-menu-item>
        <tec-dropdown-menu-item><tec-icon name="calendar-plus" slot="start" aria-hidden="true" style="width:16px;height:16px"></tec-icon>Add to Calendar</tec-dropdown-menu-item>
        <tec-dropdown-menu-item><tec-icon name="list-filter" slot="start" aria-hidden="true" style="width:16px;height:16px"></tec-icon>Add to List</tec-dropdown-menu-item>
        <tec-dropdown-menu-sub>
          <tec-dropdown-menu-sub-trigger><tec-icon name="tag" slot="start" aria-hidden="true" style="width:16px;height:16px"></tec-icon>Label As...</tec-dropdown-menu-sub-trigger>
          <tec-dropdown-menu-sub-content>
            <tec-dropdown-menu-group selection-mode="single">
              <tec-dropdown-menu-item value="personal" checked>Personal</tec-dropdown-menu-item>
              <tec-dropdown-menu-item value="work">Work</tec-dropdown-menu-item>
              <tec-dropdown-menu-item value="other">Other</tec-dropdown-menu-item>
            </tec-dropdown-menu-group>
          </tec-dropdown-menu-sub-content>
        </tec-dropdown-menu-sub>
      </tec-dropdown-menu-group>
      <tec-dropdown-menu-separator></tec-dropdown-menu-separator>
      <tec-dropdown-menu-group>
        <tec-dropdown-menu-item variant="destructive"><tec-icon name="trash" slot="start" aria-hidden="true" style="width:16px;height:16px"></tec-icon>Trash</tec-dropdown-menu-item>
      </tec-dropdown-menu-group>
    </tec-dropdown-menu>
  </tec-button-group>
</tec-button-group>
<script type="module">
  import { Archive, ArrowLeft, CalendarPlus, Clock, Ellipsis, ListFilter, MailCheck, Tag, Trash } from "lucide"
  import { registerIcons } from "@tecton/wc/icon/registry.js"

  registerIcons({ Archive, ArrowLeft, CalendarPlus, Clock, Ellipsis, ListFilter, MailCheck, Tag, Trash })
</script>
