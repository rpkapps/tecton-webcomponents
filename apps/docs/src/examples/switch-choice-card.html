<tec-field-group class="w-full max-w-sm">
  <tec-field-label for="switch-choice-card-share">
    <tec-field orientation="horizontal">
      <tec-field-content>
        <tec-field-title>Share across devices</tec-field-title>
        <tec-field-description>Focus is shared across devices, and turns off when you leave the app.</tec-field-description>
      </tec-field-content>
      <tec-switch id="switch-choice-card-share"></tec-switch>
    </tec-field>
  </tec-field-label>
  <tec-field-label for="switch-choice-card-notifications">
    <tec-field orientation="horizontal">
      <tec-field-content>
        <tec-field-title>Enable notifications</tec-field-title>
        <tec-field-description>Receive notifications when focus mode is enabled or disabled.</tec-field-description>
      </tec-field-content>
      <tec-switch id="switch-choice-card-notifications" checked></tec-switch>
    </tec-field>
  </tec-field-label>
</tec-field-group>
