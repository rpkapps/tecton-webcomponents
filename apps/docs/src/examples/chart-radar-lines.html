<tec-chart id="chart-radar-lines" class="mx-auto aspect-square w-full max-w-[300px]" label="Visitors by month and device, radar lines">
  <tec-chart-tooltip indicator="line"></tec-chart-tooltip>
  <tec-chart-legend></tec-chart-legend>
  <tec-chart-polar-grid radial-lines="false"></tec-chart-polar-grid>
  <tec-chart-polar-angle-axis key="month"></tec-chart-polar-angle-axis>
  <tec-chart-radar key="desktop" fill="none" stroke-width="2" dots></tec-chart-radar>
  <tec-chart-radar key="mobile" fill="none" stroke-width="2" dots></tec-chart-radar>
</tec-chart>
<script type="module">
  const chart = document.getElementById("chart-radar-lines")
  chart.querySelector("tec-chart-polar-angle-axis").tickFormatter = (value) => value.slice(0, 3)
  chart.config = {
    desktop: { label: "Desktop", color: "var(--tec-chart-1)" },
    mobile: { label: "Mobile", color: "var(--tec-chart-2)" },
  }
  chart.data = [
    { month: "January", desktop: 186, mobile: 160 },
    { month: "February", desktop: 185, mobile: 170 },
    { month: "March", desktop: 207, mobile: 180 },
    { month: "April", desktop: 173, mobile: 160 },
    { month: "May", desktop: 160, mobile: 190 },
    { month: "June", desktop: 174, mobile: 204 },
  ]
</script>
