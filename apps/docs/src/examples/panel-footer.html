<tec-panel class="h-72 w-full max-w-sm" variant="elevated">
  <tec-panel-header>
    <tec-panel-title>Alternative B</tec-panel-title>
    <tec-panel-description>4 wells, 1 template — base case</tec-panel-description>
  </tec-panel-header>
  <tec-panel-content>
    <div class="flex flex-col gap-4">
      <tec-meter label="Geological risk" value="30" color="auto" value-label="Low"></tec-meter>
      <tec-meter label="Drilling complexity" value="70" color="auto" value-label="High"></tec-meter>
      <tec-meter label="Confidence" value="85" color="info" show-value></tec-meter>
    </div>
  </tec-panel-content>
  <tec-panel-footer justify="end">
    <tec-button variant="ghost" size="sm">Compare</tec-button>
    <tec-button size="sm">Open</tec-button>
  </tec-panel-footer>
</tec-panel>
