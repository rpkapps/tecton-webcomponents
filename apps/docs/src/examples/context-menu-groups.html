<tec-context-menu>
  <div slot="trigger" tabindex="0" class="flex aspect-video w-full max-w-xs items-center justify-center rounded-xl border border-dashed text-sm">Right click here</div>
  <tec-context-menu-group>
    <tec-context-menu-label>File</tec-context-menu-label>
    <tec-context-menu-item>New File <tec-context-menu-shortcut>⌘N</tec-context-menu-shortcut></tec-context-menu-item>
    <tec-context-menu-item>Open File <tec-context-menu-shortcut>⌘O</tec-context-menu-shortcut></tec-context-menu-item>
    <tec-context-menu-item>Save <tec-context-menu-shortcut>⌘S</tec-context-menu-shortcut></tec-context-menu-item>
  </tec-context-menu-group>
  <tec-context-menu-separator></tec-context-menu-separator>
  <tec-context-menu-group>
    <tec-context-menu-label>Edit</tec-context-menu-label>
    <tec-context-menu-item>Undo <tec-context-menu-shortcut>⌘Z</tec-context-menu-shortcut></tec-context-menu-item>
    <tec-context-menu-item>Redo <tec-context-menu-shortcut>⇧⌘Z</tec-context-menu-shortcut></tec-context-menu-item>
  </tec-context-menu-group>
  <tec-context-menu-separator></tec-context-menu-separator>
  <tec-context-menu-group>
    <tec-context-menu-item>Cut <tec-context-menu-shortcut>⌘X</tec-context-menu-shortcut></tec-context-menu-item>
    <tec-context-menu-item>Copy <tec-context-menu-shortcut>⌘C</tec-context-menu-shortcut></tec-context-menu-item>
    <tec-context-menu-item>Paste <tec-context-menu-shortcut>⌘V</tec-context-menu-shortcut></tec-context-menu-item>
  </tec-context-menu-group>
  <tec-context-menu-separator></tec-context-menu-separator>
  <tec-context-menu-group>
    <tec-context-menu-item variant="destructive">Delete <tec-context-menu-shortcut>⌫</tec-context-menu-shortcut></tec-context-menu-item>
  </tec-context-menu-group>
</tec-context-menu>
