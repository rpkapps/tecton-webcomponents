<tec-app-shell class="h-72 w-full max-w-3xl overflow-hidden rounded-lg border border-border">
  <tec-app-shell-header>
    <tec-app-shell-brand>
      {Hexagon}
      Tecton
    </tec-app-shell-brand>
  </tec-app-shell-header>
  <tec-app-shell-body>
    <tec-app-shell-main>
      <div class="p-4 text-sm text-muted-foreground">Seismic section</div>
    </tec-app-shell-main>
    <tec-app-shell-aside aria-label="Selection" class="w-64">
      <div class="flex flex-col gap-2 p-2">
        <tec-panel variant="flat" size="sm">
          <tec-panel-header>
            <tec-panel-title>Selected well</tec-panel-title>
          </tec-panel-header>
          <tec-panel-content class="flex gap-6">
            <tec-stat size="sm">
              <tec-stat-label>TD</tec-stat-label>
              <tec-stat-value unit="m">3 250</tec-stat-value>
            </tec-stat>
            <tec-stat size="sm">
              <tec-stat-label>Picks</tec-stat-label>
              <tec-stat-value>12</tec-stat-value>
            </tec-stat>
          </tec-panel-content>
        </tec-panel>
      </div>
    </tec-app-shell-aside>
  </tec-app-shell-body>
</tec-app-shell>
