<div class="w-full max-w-2xl min-w-64 resize-x overflow-hidden rounded-md border border-border p-4">
  <tec-page-header>
    <tec-page-header-content>
      <tec-page-header-title>Wells</tec-page-header-title>
      <tec-page-header-description>23 wells across 4 fields.</tec-page-header-description>
    </tec-page-header-content>
    <tec-page-header-actions>
      <!-- Secondary actions collapse into the More menu when the header is narrow. -->
      <tec-overflow-item value="settings">
        <tec-button variant="ghost"><svg slot="start" xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M9.671 4.136a2.34 2.34 0 0 1 4.659 0 2.34 2.34 0 0 0 3.319 1.915 2.34 2.34 0 0 1 2.33 4.033 2.34 2.34 0 0 0 0 3.831 2.34 2.34 0 0 1-2.33 4.033 2.34 2.34 0 0 0-3.319 1.915 2.34 2.34 0 0 1-4.659 0 2.34 2.34 0 0 0-3.32-1.915 2.34 2.34 0 0 1-2.33-4.033 2.34 2.34 0 0 0 0-3.831A2.34 2.34 0 0 1 6.35 6.051a2.34 2.34 0 0 0 3.319-1.915"/><circle cx="12" cy="12" r="3"/></svg><tec-overflow-label>Settings</tec-overflow-label></tec-button>
      </tec-overflow-item>
      <tec-overflow-item value="export" priority="1">
        <tec-button variant="outline"><svg slot="start" xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 15V3"/><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><path d="m7 10 5 5 5-5"/></svg><tec-overflow-label>Export</tec-overflow-label></tec-button>
      </tec-overflow-item>
      <tec-overflow-item value="share" priority="2">
        <tec-button variant="outline"><svg slot="start" xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 2v13"/><path d="m16 6-4-4-4 4"/><path d="M4 12v8a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2v-8"/></svg><tec-overflow-label>Share</tec-overflow-label></tec-button>
      </tec-overflow-item>
      <!-- Not wrapped: the primary action never leaves the row. -->
      <tec-button><svg slot="start" xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 12h14"/><path d="M12 5v14"/></svg>New well</tec-button>
    </tec-page-header-actions>
  </tec-page-header>
</div>
