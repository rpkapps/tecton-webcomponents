<div class="w-full max-w-2xl min-w-64 resize-x overflow-hidden rounded-md border border-border p-4">
  <tec-page-header>
    <tec-page-header-content>
      <tec-page-header-title>Wells</tec-page-header-title>
      <tec-page-header-description>23 wells across 4 fields.</tec-page-header-description>
    </tec-page-header-content>
    <tec-page-header-actions>
      <!-- Secondary actions collapse into the More menu when the header is narrow. -->
      <tec-overflow-item value="settings">
        <tec-button variant="ghost"><tec-icon name="settings" slot="start" aria-hidden="true"></tec-icon><tec-overflow-label>Settings</tec-overflow-label></tec-button>
      </tec-overflow-item>
      <tec-overflow-item value="export" priority="1">
        <tec-button variant="outline"><tec-icon name="download" slot="start" aria-hidden="true"></tec-icon><tec-overflow-label>Export</tec-overflow-label></tec-button>
      </tec-overflow-item>
      <tec-overflow-item value="share" priority="2">
        <tec-button variant="outline"><tec-icon name="share" slot="start" aria-hidden="true"></tec-icon><tec-overflow-label>Share</tec-overflow-label></tec-button>
      </tec-overflow-item>
      <!-- Not wrapped: the primary action never leaves the row. -->
      <tec-button><tec-icon name="plus" slot="start" aria-hidden="true"></tec-icon>New well</tec-button>
    </tec-page-header-actions>
  </tec-page-header>
</div>
<script type="module">
  import { Download, Plus, Settings, Share } from "lucide"
  import { registerIcons } from "@tecton/wc/icon/registry.js"

  registerIcons({ Download, Plus, Settings, Share })
</script>
