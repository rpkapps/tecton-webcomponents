<div class="grid w-full max-w-2xl gap-4 sm:grid-cols-2">
  <tec-theme-root theme="light" class="block rounded-lg border border-border bg-background p-4">
    <div class="flex flex-col gap-3 text-sm">
      <span class="font-medium">Light</span>
      <span class="text-muted-foreground">Pinned with <code>theme="light"</code>.</span>
      <div class="flex gap-2">
        <tec-button size="sm">Primary</tec-button>
        <tec-button size="sm" variant="outline">Outline</tec-button>
      </div>
    </div>
  </tec-theme-root>
  <tec-theme-root theme="dark" class="block rounded-lg border border-border bg-background p-4">
    <div class="flex flex-col gap-3 text-sm">
      <span class="font-medium">Dark</span>
      <span class="text-muted-foreground">Pinned with <code>theme="dark"</code>.</span>
      <div class="flex gap-2">
        <tec-button size="sm">Primary</tec-button>
        <tec-button size="sm" variant="outline">Outline</tec-button>
      </div>
    </div>
  </tec-theme-root>
</div>
