<div id="overflow-forms" class="flex w-full max-w-2xl flex-col gap-2">
  <div class="min-w-40 resize-x overflow-hidden rounded-md border border-border p-2">
    <tec-toolbar aria-label="List tools">
      <!-- Elastic: shrinks before anything collapses; in the menu it opens a dialog holding the same field. -->
      <tec-overflow-item value="search" label="Search" priority="3" elastic style="--tec-overflow-item-min: 8rem; --tec-overflow-item-max: 20rem">
        <tec-icon name="search" slot="icon" aria-hidden="true" style="width:16px;height:16px"></tec-icon>
        <tec-input aria-label="Search wells" placeholder="Search wells"></tec-input>
      </tec-overflow-item>
      <!-- A select becomes a submenu of radio items. -->
      <tec-overflow-item value="field" label="Field" priority="2">
        <tec-icon name="filter" slot="icon" aria-hidden="true" style="width:16px;height:16px"></tec-icon>
        <tec-select aria-label="Field" value="All fields" class="w-36">
          <tec-select-item value="All fields">All fields</tec-select-item>
          <tec-select-item value="Gullfaks">Gullfaks</tec-select-item>
          <tec-select-item value="Statfjord">Statfjord</tec-select-item>
          <tec-select-item value="Snorre">Snorre</tec-select-item>
        </tec-select>
      </tec-overflow-item>
      <tec-overflow-divider></tec-overflow-divider>
      <!-- A toggle becomes a checkbox item. -->
      <tec-overflow-item value="preview" label="Preview pane" priority="1">
        <tec-toggle variant="outline" aria-label="Preview pane" pressed><tec-icon name="eye" aria-hidden="true"></tec-icon></tec-toggle>
      </tec-overflow-item>
      <!-- A dropdown keeps its label and chevron; it becomes a submenu with the same items. -->
      <tec-overflow-group label="Export">
        <tec-overflow-item value="export" label="Export" label-behavior="keep">
          <tec-dropdown-menu>
            <tec-button slot="trigger" variant="outline"><tec-icon name="download" slot="start" aria-hidden="true"></tec-icon>Export<tec-icon name="chevron-down" slot="end" aria-hidden="true"></tec-icon></tec-button>
            <tec-dropdown-menu-label>Format</tec-dropdown-menu-label>
            <tec-dropdown-menu-item value="csv">CSV</tec-dropdown-menu-item>
            <tec-dropdown-menu-item value="excel">Excel</tec-dropdown-menu-item>
            <tec-dropdown-menu-item value="pdf">PDF</tec-dropdown-menu-item>
          </tec-dropdown-menu>
        </tec-overflow-item>
      </tec-overflow-group>
    </tec-toolbar>
  </div>
  <p class="text-xs text-muted-foreground">Drag the corner to resize. <span data-status></span></p>
</div>
<script type="module">
  import { ChevronDown, Download, Eye, Filter, Search } from "lucide"
  import { registerIcons } from "@tecton/wc/icon/registry.js"

  registerIcons({ ChevronDown, Download, Eye, Filter, Search })

  const root = document.getElementById("overflow-forms")
  const status = root.querySelector("[data-status]")
  const input = root.querySelector("tec-input")
  const select = root.querySelector("tec-select")
  const toggle = root.querySelector("tec-toggle")
  let exported = ""

  // The same listeners serve the row and the More menu: the menu acts through the controls.
  const render = () => {
    const parts = [select.value]
    if (input.value) parts.push(`"${input.value}"`)
    if (toggle.pressed) parts.push("preview on")
    if (exported) parts.push(`exported as ${exported}`)
    status.textContent = parts.join(" · ")
  }
  root.addEventListener("input", render)
  root.addEventListener("change", render)
  root.addEventListener("click", () => queueMicrotask(render))
  root.addEventListener("tec-select", (event) => {
    if (event.target.localName === "tec-dropdown-menu-item") {
      exported = event.target.textContent.trim()
      render()
    }
  })
  Promise.all(["tec-select", "tec-toggle", "tec-input"].map((tag) => customElements.whenDefined(tag))).then(render)
</script>
