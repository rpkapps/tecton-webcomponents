<tec-button-group>
  <tec-button-group>
    <tec-select value="$" value-display="value" aria-label="Currency" class="font-mono">
      <tec-select-group>
        <tec-select-item value="$">$ <span class="text-muted-foreground">US Dollar</span></tec-select-item>
        <tec-select-item value="€">€ <span class="text-muted-foreground">Euro</span></tec-select-item>
        <tec-select-item value="£">£ <span class="text-muted-foreground">British Pound</span></tec-select-item>
      </tec-select-group>
    </tec-select>
    <tec-input placeholder="10.00" pattern="[0-9]*" aria-label="Amount"></tec-input>
  </tec-button-group>
  <tec-button-group>
    <tec-button aria-label="Send" size="icon" variant="outline"><svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 12h14"/><path d="m12 5 7 7-7 7"/></svg></tec-button>
  </tec-button-group>
</tec-button-group>
