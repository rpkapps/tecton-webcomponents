<tec-app-shell class="h-auto w-full max-w-3xl overflow-hidden rounded-lg border border-border">
  <tec-app-shell-header>
    <tec-app-shell-brand>Tecton</tec-app-shell-brand>
    <tec-app-shell-actions>
      <tec-app-shell-command-trigger></tec-app-shell-command-trigger>
      <tec-app-shell-action label="Help" shortcut="?">
        {CircleHelp}
      </tec-app-shell-action>
      <tec-app-shell-action label="Report a bug" class="hidden lg:inline-flex">
        {Bug}
      </tec-app-shell-action>
      <tec-app-shell-action label="Settings" class="hidden lg:inline-flex">
        {Settings}
      </tec-app-shell-action>
      <tec-dropdown-menu side="bottom" align="end" class="lg:hidden">
        <tec-app-shell-overflow-trigger slot="trigger"></tec-app-shell-overflow-trigger>
        <tec-dropdown-menu-item>
          {Bug}
          Report a bug
        </tec-dropdown-menu-item>
        <tec-dropdown-menu-item>
          {Settings}
          Settings
        </tec-dropdown-menu-item>
      </tec-dropdown-menu>
      <tec-app-shell-divider></tec-app-shell-divider>
      <tec-dropdown-menu side="bottom" align="end">
        <tec-app-shell-user-menu-trigger slot="trigger" name="Sarah Elliott" image="/avatars/01.png"></tec-app-shell-user-menu-trigger>
        <tec-dropdown-menu-item>
          {LogOut}
          Sign out
        </tec-dropdown-menu-item>
      </tec-dropdown-menu>
    </tec-app-shell-actions>
  </tec-app-shell-header>
</tec-app-shell>
